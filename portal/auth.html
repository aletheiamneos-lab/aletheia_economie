<!doctype html>
<html lang="ro">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Administrare — A mentor</title>
<meta name="robots" content="noindex">
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Cpath d='M12 2a4 4 0 0 0-4 4v.1A4 4 0 0 0 5 10a4 4 0 0 0 .7 2.2A4 4 0 0 0 7 19a4 4 0 0 0 5 2 4 4 0 0 0 5-2 4 4 0 0 0 1.3-6.8A4 4 0 0 0 19 10a4 4 0 0 0-3-3.9V6a4 4 0 0 0-4-4Z' fill='%231f2937'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@600;700;800&family=Source+Serif+4:opsz,wght@8..60,600;8..60,700&family=Work+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/portal.css">
</head>
<body data-mode="admin">
<div class="brand" aria-label="A mentor">
  <i><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2a4 4 0 0 0-4 4v.1A4 4 0 0 0 5 10a4 4 0 0 0 .7 2.2A4 4 0 0 0 7 19a4 4 0 0 0 5 2 4 4 0 0 0 5-2 4 4 0 0 0 1.3-6.8A4 4 0 0 0 19 10a4 4 0 0 0-3-3.9V6a4 4 0 0 0-4-4Z"/></svg></i>
  A mentor <small>· administrare</small>
</div>

<main class="stage">
  <div class="seam" aria-hidden="true"><b>sau</b></div>

  <section class="side logic" aria-labelledby="logic-title">
    <div class="inner head">
      <div class="lockup">
        <svg class="folder" viewBox="0 0 64 54" aria-hidden="true"><path d="M5 9a4 4 0 0 1 4-4h16l6 7h24a4 4 0 0 1 4 4v29a4 4 0 0 1-4 4H9a4 4 0 0 1-4-4Z"/><text x="32" y="38" text-anchor="middle">L</text></svg>
        <div><h2 id="logic-title">Logica</h2><small>administrare</small></div>
      </div>
      <p class="desc">Elevi autorizați, teste integrate, monitorizare live și rapoarte.</p>
    </div>
    <div class="inner card" data-app="logica">
      <form data-panel="admin" novalidate>
        <label><span>Parolă administrator</span><input name="password" type="password" autocomplete="current-password" placeholder="Introdu parola" required></label>
        <button class="submit" type="submit"><span class="t">Administrează Logica</span><span class="a">→</span></button>
      </form>
      <p class="msg" role="alert" hidden></p>
    </div>
  </section>

  <section class="side econ" aria-labelledby="econ-title">
    <div class="inner head">
      <div class="lockup">
        <svg class="folder" viewBox="0 0 64 54" aria-hidden="true"><path d="M5 9a4 4 0 0 1 4-4h16l6 7h24a4 4 0 0 1 4 4v29a4 4 0 0 1-4 4H9a4 4 0 0 1-4-4Z"/><text x="32" y="38" text-anchor="middle">E</text></svg>
        <div><h2 id="econ-title">Economie</h2><small>administrare</small></div>
      </div>
      <p class="desc">Elevi autorizați, activitate live, rapoarte, spațiu Supabase și bibliotecă.</p>
    </div>
    <div class="inner card" data-app="economie">
      <form data-panel="admin" novalidate>
        <label><span>Parolă administrator</span><input name="password" type="password" autocomplete="current-password" placeholder="Introdu parola" required></label>
        <button class="submit" type="submit"><span class="t">Administrează Economia</span><span class="a">→</span></button>
      </form>
      <p class="msg" role="alert" hidden></p>
    </div>
  </section>
</main>

<p class="footer"><a href="/">← Înapoi la pagina elevilor</a></p>
<script src="/portal.js"></script>
</body>
</html>
