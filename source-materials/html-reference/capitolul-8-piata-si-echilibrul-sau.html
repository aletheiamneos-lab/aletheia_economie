<!doctype html>
<html lang="ro">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Capitolul 8 · Piața și echilibrul său</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,500;8..60,600&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet" />
<style>
:root {
  --bg: #f5f6f4;
  --surface: #ffffff;
  --surface-2: #eef1ed;
  --border: #d8dcd6;
  --text: #1b2420;
  --text-muted: #5c6660;
  --accent: #1e3a5f;
  --accent-soft: #e7edf3;
  --good: #1f7a4d;
  --good-bg: #e8f5ee;
  --bad: #b23a2e;
  --bad-bg: #fbeae8;
  --mark: #a8790f;
  --font-display: "Source Serif 4", Georgia, serif;
  --font-body: "Inter", system-ui, sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, monospace;
}
* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; background: var(--bg); color: var(--text); font-family: var(--font-body); }
#app { max-width: 800px; margin: 0 auto; padding: 0 20px 90px; }
h1, h2, h3 { font-weight: 600; color: var(--text); margin: 0; }
p { line-height: 1.7; color: var(--text); margin: 0 0 12px; }
p:last-child { margin-bottom: 0; }

.toc { border: 1px solid var(--border); border-radius: 10px; padding: 16px 20px; margin-top: 20px; background: var(--surface); }
.toc__titlu { font-family: var(--font-mono); font-size: 11.5px; text-transform: uppercase; letter-spacing: 0.06em; color: var(--text-muted); margin-bottom: 8px; }
.toc ol { margin: 0; padding-left: 18px; columns: 2; column-gap: 24px; }
.toc li { font-size: 13.5px; margin-bottom: 5px; break-inside: avoid; }
.toc a { color: var(--accent); text-decoration: none; }
.toc a:hover { text-decoration: underline; }
@media (max-width: 560px) { .toc ol { columns: 1; } }

.scor-bar { position: sticky; top: 0; z-index: 10; padding: 10px 16px 12px; margin: 0 -20px; background: rgba(245, 246, 244, 0.95); backdrop-filter: blur(4px); border-bottom: 1px solid var(--border); }
.scor-bar__row { display: flex; align-items: center; justify-content: space-between; gap: 16px; margin-bottom: 6px; }
.scor-bar__label { font-family: var(--font-mono); font-size: 12.5px; color: var(--text-muted); white-space: nowrap; }
.scor-bar__track { height: 5px; border-radius: 3px; background: var(--surface-2); overflow: hidden; display: flex; }
.scor-bar__fill-good { background: var(--good); height: 100%; }
.scor-bar__fill-bad { background: var(--bad); height: 100%; }

.header { padding: 30px 0 6px; }
.header__eyebrow { font-family: var(--font-mono); font-size: 12.5px; color: var(--accent); letter-spacing: 0.06em; text-transform: uppercase; }
.header__titlu { font-family: var(--font-display); font-weight: 600; font-size: 30px; line-height: 1.3; margin-top: 6px; }

.obiective { border: 1px solid var(--border); border-radius: 10px; padding: 18px 22px; margin-top: 20px; background: var(--surface); }
.obiective__titlu { font-family: var(--font-display); font-weight: 600; font-size: 15px; color: var(--accent); margin-bottom: 10px; }
.obiective ul { margin: 0; padding-left: 18px; }
.obiective li { color: var(--text-muted); margin-bottom: 6px; font-size: 14.5px; }

.sectiune-titlu { font-family: var(--font-display); font-weight: 600; font-size: 22px; color: var(--text); margin: 44px 0 4px; padding-bottom: 8px; border-bottom: 2px solid var(--accent); }

.teorie-box { border: 1px solid var(--border); border-radius: 10px; padding: 20px 24px; margin-top: 16px; background: var(--surface); scroll-margin-top: 76px; }
.teorie-box__titlu { font-family: var(--font-display); font-weight: 600; font-size: 17px; color: var(--text); cursor: pointer; display: flex; align-items: baseline; gap: 10px; justify-content: space-between; }
.teorie-box__nr { font-family: var(--font-mono); font-size: 13px; color: var(--accent); font-weight: 500; }
.teorie-box__chevron { font-family: var(--font-mono); color: var(--text-muted); font-size: 14px; }
.teorie-box__body { margin-top: 12px; }
.teorie-box ul { margin: 8px 0 12px; padding-left: 18px; }
.teorie-box li { margin-bottom: 6px; font-size: 14.5px; color: var(--text); }

.exemplu { font-family: var(--font-body); font-style: italic; background: var(--accent-soft); border-left: 3px solid var(--accent); border-radius: 0 8px 8px 0; padding: 10px 16px; margin-top: 10px; font-size: 14px; color: var(--text); }
.exemplu__eticheta { display: block; font-style: normal; font-family: var(--font-mono); font-size: 11.5px; text-transform: uppercase; letter-spacing: 0.04em; color: var(--accent); margin-bottom: 3px; }

.formula { font-family: var(--font-mono); background: var(--surface-2); border-radius: 8px; padding: 9px 14px; margin-top: 10px; font-size: 13.5px; }
.formula__nume { display: block; font-family: var(--font-body); font-size: 12px; color: var(--text-muted); margin-bottom: 2px; }

.clasificare { margin-top: 16px; }
.clasificare__criteriu { font-family: var(--font-mono); font-size: 12px; color: var(--text-muted); margin-bottom: 4px; }
.clasificare__definitii { margin-top: 10px; }
.clasificare__definitii p { font-size: 13.5px; margin: 0 0 6px; color: var(--text); }
.clasificare__definitii p:last-child { margin-bottom: 0; }
.clasificare__definitii strong { color: var(--accent); }

.mini-calc { margin-top: 14px; padding: 14px 16px; border: 1px dashed var(--accent); border-radius: 8px; background: var(--accent-soft); }
.mini-calc__titlu { font-family: var(--font-mono); font-size: 11.5px; text-transform: uppercase; letter-spacing: 0.04em; color: var(--accent); margin-bottom: 10px; }
.mini-calc__randuri { display: flex; gap: 18px; flex-wrap: wrap; margin-bottom: 10px; }
.mini-calc__randuri label { display: flex; flex-direction: column; gap: 4px; font-size: 12.5px; color: var(--text-muted); font-family: var(--font-mono); }
.mini-calc__randuri input { font-family: var(--font-mono); font-size: 14px; padding: 6px 10px; border: 1px solid var(--border); border-radius: 6px; width: 100px; background: var(--surface); color: var(--text); }
.mini-calc__rezultat { font-family: var(--font-mono); font-size: 13.5px; color: var(--text); }
.mini-calc__rezultat strong { color: var(--accent); }

.diagrama { margin-top: 12px; }
.diagrama__nota { font-size: 12.5px; color: var(--text-muted); margin-top: 8px; }

.mini-sim { margin-top: 14px; padding-top: 14px; border-top: 1px dashed var(--border); }
.mini-sim__titlu { font-family: var(--font-mono); font-size: 11.5px; text-transform: uppercase; letter-spacing: 0.04em; color: var(--accent); margin-bottom: 10px; }
.mini-sim__slider label { display: flex; justify-content: space-between; font-size: 13px; color: var(--text-muted); margin-bottom: 6px; font-family: var(--font-mono); }
.mini-sim__slider input[type="range"] { width: 100%; accent-color: var(--accent); }
.mini-sim__citire { font-family: var(--font-mono); font-size: 13.5px; margin-top: 12px; }
.mini-sim__citire strong { color: var(--mark); }
.mini-sim__surplus { display: flex; gap: 20px; margin-top: 14px; font-family: var(--font-mono); flex-wrap: wrap; }
.mini-sim__surplus div strong { display: block; font-size: 18px; }
.mini-sim__surplus div span { color: var(--text-muted); font-size: 11.5px; }

.preset-butoane { display: flex; gap: 8px; margin-top: 12px; flex-wrap: wrap; }
.preset-buton { font-family: var(--font-body); font-size: 12.5px; padding: 6px 12px; border-radius: 6px; border: 1px solid var(--border); background: transparent; color: var(--text); cursor: pointer; }
.preset-buton:hover { border-color: var(--accent); color: var(--accent); }
.preset-buton.activ { border-color: var(--accent); background: var(--accent-soft); color: var(--accent); }

.nota-legatura { font-size: 13.5px; color: var(--text-muted); margin-top: 10px; padding-top: 10px; border-top: 1px dashed var(--border); }
.nota-legatura a { color: var(--accent); }

.exercitiu-eyebrow { font-family: var(--font-display); font-weight: 600; font-size: 20px; color: var(--accent); margin-top: 44px; margin-bottom: 4px; }
.exercitiu-sub { color: var(--text-muted); font-size: 13.5px; margin-bottom: 6px; }

.card { border: 1px solid var(--border); border-radius: 10px; padding: 18px 22px; margin-top: 14px; background: var(--surface); }
.card__intrebare { font-size: 15px; margin-bottom: 14px; margin-top: 0; font-weight: 500; }

.optiuni { display: flex; flex-direction: column; gap: 8px; }
.optiune { display: flex; align-items: center; gap: 10px; padding: 9px 12px; border: 1px solid var(--border); border-radius: 8px; cursor: pointer; font-size: 14.5px; background: transparent; color: var(--text); text-align: left; font-family: var(--font-body); }
.optiune:hover:not(:disabled) { border-color: var(--accent); }
.optiune.selectata { border-color: var(--accent); background: var(--accent-soft); }
.optiune.corecta { border-color: var(--good); background: var(--good-bg); color: var(--good); }
.optiune.gresita { border-color: var(--bad); background: var(--bad-bg); color: var(--bad); }

.buton { font-family: var(--font-body); font-weight: 600; font-size: 14px; padding: 9px 18px; border-radius: 8px; border: 1.5px solid var(--accent); background: transparent; color: var(--accent); cursor: pointer; margin-top: 14px; }
.buton:hover:not(:disabled) { background: var(--accent-soft); }
.buton:disabled { opacity: 0.4; cursor: not-allowed; }

.af-butoane { display: flex; gap: 10px; }
.af-buton { flex: 1; padding: 10px; border-radius: 8px; border: 1px solid var(--border); background: transparent; color: var(--text); font-family: var(--font-body); font-size: 14px; cursor: pointer; }
.af-buton.corecta { border-color: var(--good); background: var(--good-bg); color: var(--good); }
.af-buton.gresita { border-color: var(--bad); background: var(--bad-bg); color: var(--bad); }

.problema-input { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.problema-input input { font-family: var(--font-mono); font-size: 15px; padding: 8px 12px; border-radius: 8px; border: 1px solid var(--border); background: var(--surface-2); color: var(--text); width: 120px; }
.problema-input input:focus { outline: 2px solid var(--accent); border-color: var(--accent); }
.unitate { color: var(--text-muted); font-family: var(--font-mono); font-size: 13px; }

.feedback { margin-top: 12px; padding: 10px 14px; border-radius: 8px; font-size: 14px; line-height: 1.55; }
.feedback.corect { background: var(--good-bg); color: var(--good); }
.feedback.gresit { background: var(--bad-bg); color: var(--bad); }

.simulator { border: 1px solid var(--border); border-radius: 10px; padding: 20px 24px; margin-top: 14px; background: var(--surface); }
.simulator__nota { margin-top: 0; color: var(--text-muted); font-size: 14px; }
.simulator__sliders { display: flex; flex-direction: column; gap: 16px; margin-top: 16px; }
.slider-row label { display: flex; justify-content: space-between; font-size: 13.5px; color: var(--text-muted); margin-bottom: 6px; font-family: var(--font-mono); }
.slider-row input[type="range"] { width: 100%; accent-color: var(--accent); }
.simulator__citire { display: flex; gap: 24px; margin-top: 16px; font-family: var(--font-mono); }
.simulator__citire strong { color: var(--accent); font-size: 19px; display: block; }
.simulator__citire span { color: var(--text-muted); font-size: 12px; }
.legenda { display: flex; gap: 18px; margin-top: 10px; font-size: 12.5px; color: var(--text-muted); flex-wrap: wrap; }
.legenda span.item { display: inline-flex; align-items: center; gap: 6px; }
.punct-legenda { width: 10px; height: 10px; border-radius: 50%; display: inline-block; }

@media (max-width: 480px) {
  .header__titlu { font-size: 24px; }
  .simulator__citire { gap: 14px; }
}
</style>
</head>
<body>
<div id="app"></div>

<script>
// ---------------------------------------------------------------------
// Continutul capitolului - teoria completa, structurata dupa manual:
// I. Piata (caracterizare generala)
// II. Cererea (definitie, factori, elasticitate)
// III. Oferta (definitie, factori, elasticitate)
// IV. Pretul si echilibrul pietei (pret, pret de echilibru, exces
//     de cerere/oferta, pret administrat)
// V. Centralizator de formule
// ---------------------------------------------------------------------
const DATA = {
  capitol: {
    numar: 8,
    titlu: 'Piața și echilibrul său',
    obiective: [
      'Să definești piața și să îi identifici funcțiile și formele principale',
      'Să explici legea cererii și legea ofertei, și factorii care le influențează',
      'Să determini prețul și cantitatea de echilibru pornind de la funcțiile cererii și ofertei',
      'Să distingi între excesul de cerere și excesul de ofertă, și să recunoști efectele unui preț administrat',
      'Să calculezi și să interpretezi coeficientul de elasticitate a cererii și a ofertei față de preț și față de venit'
    ]
  },
  teorie: [
    {
      id: 'piata',
      nr: '1',

      text: [
        'Piața reprezintă spațiul economic în care se întâlnesc cererea cumpărătorilor cu oferta vânzătorilor, aceștia schimbând între ei bunuri economice al căror preț și cantitate tind să se echilibreze. Piața nu se reduce la un spațiu fizic, geografic: ea poate exista și sub formă electronică, așa cum se întâmplă atunci când contractele se încheie prin telefon, telex sau internet.',
        'Variabilele definitorii ale pieței moderne sunt: mărfurile, cererea, oferta, prețul și concurența.'
      ],
      puncteCheie: [
        'Funcția de informare: piața informează agenții economici despre prețuri, cantități, calitatea și tipurile de mărfuri tranzacționate',
        'Funcția de reglare: piața corelează producția cu consumul, cererea cu oferta, și asigură alocarea eficientă a resurselor',
        'Funcția de selecție: piața selectează agenții economici după criterii de eficiență',
        'După natura obiectului tranzacționat: piața factorilor de producție (monetară, a muncii, a capitalurilor, a resurselor naturale) și piața bunurilor de consum final',
        'După purtătorii cererii/ofertei: piața vânzătorilor și piața cumpărătorilor',
        'După momentul finalizării tranzacțiilor: piața la vedere (imediată) și piața la termen (livrare la o dată ulterioară)',
        'După numărul participanților și puterea lor economică de a influența prețul: piață cu concurență perfectă și piață cu concurență imperfectă (monopolistică, oligopol, monopol, monopson)'
      ],
      formule: []
    },
    {
      id: 'cerere-def',
      nr: '2',
      titlu: 'Cererea: definiție și legea cererii',
      text: [
        'Cererea reprezintă cantitatea dintr-un bun economic pe care consumatorii doresc și au capacitatea să o cumpere, la diferite niveluri de preț, într-o perioadă de timp determinată. Prin însumarea cererilor individuale ale tuturor consumatorilor, pentru fiecare nivel de preț, se obține cererea pieței.',
        'Cererea nu se confundă cu cantitatea cerută: cantitatea cerută este o singură valoare, la un singur preț, în timp ce cererea descrie întreaga relație dintre preț și cantitate, pentru toate nivelurile posibile de preț. Cererea nu se confundă nici cu nevoile oamenilor: nu toate nevoile sunt satisfăcute prin intermediul pieței, deci între cerere și nevoi există o relație ca de la parte la întreg.',
        'Legea cererii arată că, atunci când prețul unui bun crește, cantitatea cerută din acel bun scade, și invers, în condițiile în care ceilalți factori rămân neschimbați. Explicația vine din legea utilității marginale descrescânde: cu cât consumăm mai mult dintr-un bun, cu atât utilitatea marginală - și, odată cu ea, suma pe care suntem dispuși să o plătim - scade. O modificare a prețului determină o mișcare de-a lungul curbei cererii, numită extindere a cererii (când prețul scade) sau contracție a cererii (când prețul crește).'
      ],
      exemple: [
        'Cu cât mănânci mai multe prăjituri, la rând, cu atât ești dispus să plătești mai puțin pe următoarea - de-asta prețul și cantitatea cerută variază, de regulă, în sens opus.'
      ],
      formule: []
    },
    {
      id: 'cerere-factori',
      nr: '3',
      titlu: 'Factorii care influențează cererea',
      text: [

      ],
      puncteCheie: [
        'Venitul consumatorilor: pentru bunurile normale, cererea crește odată cu venitul (de ex. automobile, îmbrăcăminte); pentru bunurile inferioare, cererea scade când venitul crește (de ex. pâine, cartofi, fasole)',
        'Prețul bunurilor substituibile: dacă prețul zahărului crește, cererea de zaharină crește (relație pozitivă)',
        'Prețul bunurilor complementare: dacă prețul stiloului crește, cererea de cerneală scade (relație negativă)',
        'Numărul de consumatori: cererea e mai mare acolo unde sunt mai mulți cumpărători (de ex. cererea de pâine e mai mare în București decât în Constanța)',

      ],
      formule: []
    },
    {
      id: 'cerere-elasticitate',
      nr: '4',
      titlu: 'Elasticitatea cererii față de preț și față de venit',
      text: [
        'Elasticitatea cererii reflectă sensibilitatea cantității cerute la modificarea prețului sau a venitului. Ea se măsoară cu ajutorul coeficientului de elasticitate.'
      ],
      puncteCheie: [
        'E(Q/P) > 1: cerere elastică - o variație a prețului produce o variație mai mare, în sens opus, a cantității cerute (de ex. bunuri de lux, produse electronice, bunuri cu mulți înlocuitori)',

        'E(Q/P) < 1: cerere inelastică - cantitatea cerută reacționează slab la variația prețului (de ex. bunurile de strictă necesitate)',
        'Cazuri extreme, mai rar întâlnite: cerere perfect elastică (E = infinit) și cerere perfect inelastică (E = 0)',
        'Elasticitatea cererii față de venit: pozitivă pentru bunurile normale (0 < E(Q/V) < 1) sau bunurile superioare/de lux (E(Q/V) > 1); negativă pentru bunurile inferioare',
        'Pentru întreprinzător: dacă cererea e elastică, o creștere de preț reduce venitul total (VT = P x Q); dacă cererea e inelastică, o creștere de preț mărește venitul total'
      ],
      exemple: [
        'Un vânzător obține VT = 5 milioane u.m. din 1.000 de bucăți la prețul de 5.000 u.m. Dacă mărește prețul cu 10% și cererea e elastică (cantitatea scade cu 25%), VT scade la 4,125 milioane u.m. Dacă, în schimb, mărește prețul cu 25% și cererea e inelastică (cantitatea scade doar cu 10%), VT crește la 5,625 milioane u.m.'
      ],
      formule: [
        { nume: 'Elasticitatea cererii față de preț', formula: 'E(Q/P) = -(DQ/Q0) / (DP/P0)' },
        { nume: 'Elasticitatea cererii față de venit', formula: 'E(Q/V) = (DQ/Q0) / (DV/V0)' }
      ],
      calculator: 'elasticitateCerere'
    },
    {
      id: 'oferta-def',
      nr: '5',
      titlu: 'Oferta: definiție și legea ofertei',
      text: [
        'Oferta reprezintă cantitatea dintr-un bun economic pe care producătorii doresc și pot să o vândă, la diferite niveluri de preț, într-o perioadă de timp determinată. La fel ca la cerere, oferta nu se confundă cu cantitatea oferită: cantitatea oferită e o singură valoare, la un singur preț, în timp ce oferta descrie întreaga relație preț-cantitate.',
        'Cantitatea produsă și oferită de un vânzător pe piață nu este întotdeauna identică cu cantitatea efectiv vândută - între ele există, de regulă, o relație ca de la întreg la parte.',

      ],
      exemple: [],
      formule: []
    },
    {
      id: 'oferta-factori',

      titlu: 'Factorii care influențează oferta',

      puncteCheie: [

function calcEchilibru(a, b, c, d) {
  const pret = (a - c) / (b + d);
  const cantitate = a - b * pret;
  return { pret: Math.round(pret * 100) / 100, cantitate: Math.round(cantitate * 100) / 100 };
}
function cantitateCeruta(a, b, p) { return Math.max(a - b * p, 0); }
function cantitateOferita(c, d, p) { return Math.max(c + d * p, 0); }
function puncteCurbe(a, b, c, d, pas) {
  pas = pas || 12;
  const pretMax = Math.max(b ? a / b : 10, d ? (c + d * 10) / d : 10, 1);
  const puncte = [];
  for (let i = 0; i <= pas; i++) {
    const pret = Math.round((pretMax * i / pas) * 100) / 100;
    puncte.push({ pret, cerere: Math.round(cantitateCeruta(a, b, pret) * 100) / 100, oferta: Math.round(cantitateOferita(c, d, pret) * 100) / 100 });
  }
  return puncte;
}

function el(tag, className, text) {
  const e = document.createElement(tag);
  if (className) e.className = className;
  if (text !== undefined) e.textContent = text;
  return e;
}
const SVGNS = 'http://www.w3.org/2000/svg';
function elNS(tag, attrs) {
  const e = document.createElementNS(SVGNS, tag);
  for (const k in attrs) e.setAttribute(k, attrs[k]);
  return e;
}
function legendItem(color, text) {
  const span = el('span', 'item');

  span.appendChild(dot);
  span.appendChild(document.createTextNode(' ' + text));
  return span;
}
function buildDumbbellChart(label0, val0, label1, val1, maxVal, culoare0, culoare1) {
  const width = 240, height = 100, left = 16, right = 16, midY = 46;
  const usableW = width - left - right;
  const scale = usableW / maxVal;
  const x0 = left + Math.max(0, Math.min(val0, maxVal)) * scale;
  const x1 = left + Math.max(0, Math.min(val1, maxVal)) * scale;
  const svg = elNS('svg', { width: '100%', viewBox: '0 0 ' + width + ' ' + height, role: 'img', 'aria-label': label0 + ': ' + val0 + ', ' + label1 + ': ' + val1 });
  svg.appendChild(elNS('line', { x1: left, y1: midY, x2: width - right, y2: midY, stroke: 'var(--border)', 'stroke-width': 2 }));
  svg.appendChild(elNS('line', { x1: x0, y1: midY, x2: x1, y2: midY, stroke: 'var(--text-muted)', 'stroke-width': 3 }));
  svg.appendChild(elNS('circle', { cx: x0, cy: midY, r: 7, fill: culoare0, stroke: 'var(--surface)', 'stroke-width': 2 }));
  svg.appendChild(elNS('circle', { cx: x1, cy: midY, r: 7, fill: culoare1, stroke: 'var(--surface)', 'stroke-width': 2 }));
  const t0 = elNS('text', { x: x0, y: midY - 14, 'text-anchor': 'middle', 'font-family': 'var(--font-mono)', 'font-size': 11.5, fill: culoare0, 'font-weight': 600 });
  t0.textContent = Math.round(val0 * 100) / 100;
  const t1 = elNS('text', { x: x1, y: midY - 14, 'text-anchor': 'middle', 'font-family': 'var(--font-mono)', 'font-size': 11.5, fill: culoare1, 'font-weight': 600 });
  t1.textContent = Math.round(val1 * 100) / 100;
  svg.appendChild(t0); svg.appendChild(t1);
  const l0 = elNS('text', { x: left, y: midY + 30, 'text-anchor': 'start', 'font-size': 10, fill: 'var(--text-muted)' });
  l0.textContent = label0;
  const l1 = elNS('text', { x: width - right, y: midY + 30, 'text-anchor': 'end', 'font-size': 10, fill: 'var(--text-muted)' });
  l1.textContent = label1;
  svg.appendChild(l0); svg.appendChild(l1);
  return svg;
}
function buildWaterfallChart(componente) {
  const width = 260, height = 150, left = 14, right = 14, top = 14, bottom = 30;
  const chartH = height - top - bottom, chartW = width - left - right;
  const total = componente.reduce((a, c) => a + c.val, 0);
  const barW = chartW / (componente.length + 1) * 0.72;
  const gap = chartW / (componente.length + 1) * 0.28;
  const scale = chartH / (total * 1.1);
  const baseY = top + chartH;
  const svg = elNS('svg', { width: '100%', viewBox: '0 0 ' + width + ' ' + height, role: 'img', 'aria-label': 'Cascada: ' + componente.map(c => c.label + '=' + c.val).join(', ') + ', total=' + total });
  svg.appendChild(elNS('line', { x1: left, y1: baseY, x2: width - right, y2: baseY, stroke: 'var(--text-muted)', 'stroke-width': 1 }));
  let yCursor = baseY, x = left;
  componente.forEach(c => {
    const h = Math.max(2, c.val * scale);
    svg.appendChild(elNS('rect', { x, y: yCursor - h, width: barW, height: h, fill: c.culoare, rx: 2 }));
    const lv = elNS('text', { x: x + barW / 2, y: yCursor - h - 6, 'text-anchor': 'middle', 'font-family': 'var(--font-mono)', 'font-size': 10.5, fill: 'var(--text)', 'font-weight': 600 });
    lv.textContent = Math.round(c.val * 100) / 100;
    svg.appendChild(lv);
    const ll = elNS('text', { x: x + barW / 2, y: height - 10, 'text-anchor': 'middle', 'font-size': 9.5, fill: 'var(--text-muted)' });
    ll.textContent = c.label;
    svg.appendChild(ll);
    if (yCursor < baseY) svg.appendChild(elNS('line', { x1: x - gap * 0.4, y1: yCursor, x2: x, y2: yCursor, stroke: 'var(--border)', 'stroke-width': 1, 'stroke-dasharray': '2 2' }));
    yCursor -= h;
    x += barW + gap;
  });
  const hTotal = Math.max(2, total * scale);

function buildDonutChart(componente) {
  const size = 200, cx = size / 2, cy = size / 2 - 6, rOut = 70, rIn = 42;
  const total = componente.reduce((a, c) => a + Math.max(0, c.val), 0) || 1;
  const svg = elNS('svg', { width: '100%', viewBox: '0 0 ' + size + ' ' + (size + 34), role: 'img', 'aria-label': 'Compozitie: ' + componente.map(c => c.label + '=' + c.val).join(', ') });
  let unghiStart = -Math.PI / 2;
  componente.forEach(c => {
    const frac = Math.max(0, c.val) / total;
    const unghiEnd = unghiStart + frac * 2 * Math.PI;
    const x0o = cx + rOut * Math.cos(unghiStart), y0o = cy + rOut * Math.sin(unghiStart);
    const x1o = cx + rOut * Math.cos(unghiEnd), y1o = cy + rOut * Math.sin(unghiEnd);
    const x0i = cx + rIn * Math.cos(unghiEnd), y0i = cy + rIn * Math.sin(unghiEnd);
    const x1i = cx + rIn * Math.cos(unghiStart), y1i = cy + rIn * Math.sin(unghiStart);
    const mare = frac > 0.5 ? 1 : 0;
    const d = 'M ' + x0o + ' ' + y0o + ' A ' + rOut + ' ' + rOut + ' 0 ' + mare + ' 1 ' + x1o + ' ' + y1o + ' L ' + x0i + ' ' + y0i + ' A ' + rIn + ' ' + rIn + ' 0 ' + mare + ' 0 ' + x1i + ' ' + y1i + ' Z';
    if (frac > 0.001) svg.appendChild(elNS('path', { d, fill: c.culoare }));
    unghiStart = unghiEnd;
  });
  const legenda = elNS('g', {});
  componente.forEach((c, i) => {
    const ly = size + 12 + Math.floor(i / 2) * 16;
    const lx = 10 + (i % 2) * (size / 2);
    legenda.appendChild(elNS('rect', { x: lx, y: ly - 8, width: 9, height: 9, fill: c.culoare, rx: 2 }));
    const t = elNS('text', { x: lx + 13, y: ly, 'font-size': 9.5, fill: 'var(--text-muted)' });
    t.textContent = c.label + ' (' + Math.round(c.val / total * 1000) / 10 + '%)';
    legenda.appendChild(t);
  });
  svg.appendChild(legenda);
  return svg;
}

function buildMiniBarPair(items, maxVal) {

function buildElasticitateCalc() {
  const box = el('div', 'mini-calc');
  box.appendChild(el('div', 'mini-calc__titlu', 'Calculator rapid: elasticitatea cererii'));
  const randuri = el('div', 'mini-calc__randuri');

  const labelQ = document.createElement('label');
  labelQ.appendChild(document.createTextNode('Variația cantității cerute (%)'));
  const inputQ = document.createElement('input');
  inputQ.type = 'number'; inputQ.step = 'any'; inputQ.placeholder = 'ex. -20';
  labelQ.appendChild(inputQ);

  const labelP = document.createElement('label');
  labelP.appendChild(document.createTextNode('Variația prețului (%)'));
  const inputP = document.createElement('input');
  inputP.type = 'number'; inputP.step = 'any'; inputP.placeholder = 'ex. 10';
  labelP.appendChild(inputP);

  randuri.appendChild(labelQ);
  randuri.appendChild(labelP);
  box.appendChild(randuri);

  const chartWrap = el('div', 'diagrama');
  box.appendChild(chartWrap);
  const rezultat = el('div', 'mini-calc__rezultat', 'Introdu ambele valori procentuale de mai sus.');
  box.appendChild(rezultat);

  function recalc() {
    const dq = Number(inputQ.value), dp = Number(inputP.value);
    if (inputQ.value === '' || inputP.value === '' || isNaN(dq) || isNaN(dp) || dp === 0) {
      rezultat.textContent = 'Introdu ambele valori procentuale de mai sus.';
      chartWrap.innerHTML = '';
      return;
    }
    const e = Math.round((-(dq / dp)) * 100) / 100;
    let tip = 'unitar elastică (E = 1)';
    if (Math.abs(e) > 1.001) tip = 'elastică (E > 1)';
    else if (Math.abs(e) < 0.999) tip = 'inelastică (E < 1)';
    rezultat.innerHTML = '';
    rezultat.appendChild(document.createTextNode('E(Q/P) = '));
    const strong = document.createElement('strong');
    strong.textContent = e;
    rezultat.appendChild(strong);
    rezultat.appendChild(document.createTextNode(' → cerere ' + tip + '.'));
    chartWrap.innerHTML = '';
    chartWrap.appendChild(buildGaugeChart(Math.abs(e) * 33.33, 100, [
      { de: 0, pana: 30, culoare: 'var(--mark)', eticheta: 'Inelastică' },
      { de: 30, pana: 36.66, culoare: 'var(--accent)', eticheta: 'Unitară' },
      { de: 36.66, pana: 100, culoare: 'var(--good)', eticheta: 'Elastică' }
    ]));
  }
  inputQ.addEventListener('input', recalc);
  inputP.addEventListener('input', recalc);

  return box;
}

// Grafice: schelet comun (axe, grid) reutilizat de diagramele de mai jos.
// Conventie: x = Pret, y = Cantitate (ca la simulatorul din sectiunea IV).
// ---------------------------------------------------------------------
function creazaGraficBaza(maxPret, maxCant, opts) {
  opts = opts || {};
  const width = 400, height = 240;
  const left = 46, right = 10, top = 16, bottom = 28;
  const chartW = width - left - right, chartH = height - top - bottom;
  const svg = elNS('svg', { width: '100%', viewBox: '0 0 ' + width + ' ' + height, role: 'img', 'aria-label': opts.aria || 'Grafic cerere-oferta' });
  for (let i = 1; i < 5; i++) {
    const gy = top + (chartH / 5) * i;
    svg.appendChild(elNS('line', { x1: left, y1: gy, x2: left + chartW, y2: gy, stroke: 'var(--surface-2)', 'stroke-width': 1 }));
  }
  for (let i = 1; i < 6; i++) {
    const gx = left + (chartW / 6) * i;
    svg.appendChild(elNS('line', { x1: gx, y1: top, x2: gx, y2: top + chartH, stroke: 'var(--surface-2)', 'stroke-width': 1 }));
  }
  svg.appendChild(elNS('line', { x1: left, y1: top, x2: left, y2: top + chartH, stroke: 'var(--text-muted)', 'stroke-width': 1 }));
  svg.appendChild(elNS('line', { x1: left, y1: top + chartH, x2: left + chartW, y2: top + chartH, stroke: 'var(--text-muted)', 'stroke-width': 1 }));
  const labelCant = elNS('text', { x: left, y: 11, 'font-size': 10.5, fill: 'var(--text-muted)' });
  labelCant.textContent = 'Cantitate';
  const labelPret = elNS('text', { x: left + chartW, y: height - 8, 'font-size': 10.5, fill: 'var(--text-muted)', 'text-anchor': 'end' });
  labelPret.textContent = 'Preț';
  svg.appendChild(labelCant); svg.appendChild(labelPret);
  const sx = p => left + (p / maxPret) * chartW;
  const sy = q => top + chartH - (q / maxCant) * chartH;
  return { svg, sx, sy, left, top, chartW, chartH, width, height };
}

    const qs = cantitateOferita(c, d, pret);
    const x = g.sx(pret);
    linePret.setAttribute('x1', x); linePret.setAttribute('y1', g.top); linePret.setAttribute('x2', x); linePret.setAttribute('y2', g.top + g.chartH);
    const yQd = g.sy(qd), yQs = g.sy(qs);
    punctQd.setAttribute('cx', x); punctQd.setAttribute('cy', yQd);
    punctQs.setAttribute('cx', x); punctQs.setAttribute('cy', yQs);
    bracket.setAttribute('x1', x + 6); bracket.setAttribute('y1', yQd); bracket.setAttribute('x2', x + 6); bracket.setAttribute('y2', yQs);

    const diff = Math.round((qd - qs) * 10) / 10;
    let mesaj;
    if (Math.abs(diff) < 0.15) {
      mesaj = 'La ' + pret + ' u.m. (prețul de echilibru): cantitatea cerută = cantitatea oferită = ' + qd.toFixed(1) + ' buc. Piața este în echilibru, fără exces.';
    } else if (diff > 0) {
      mesaj = 'La ' + pret + ' u.m.: cantitatea cerută (' + qd.toFixed(1) + ' buc.) > cantitatea oferită (' + qs.toFixed(1) + ' buc.) → exces de cerere (deficit) de ' + Math.abs(diff).toFixed(1) + ' buc. Acesta e efectul unui preț plafon.';
    } else {
      mesaj = 'La ' + pret + ' u.m.: cantitatea oferită (' + qs.toFixed(1) + ' buc.) > cantitatea cerută (' + qd.toFixed(1) + ' buc.) → exces de ofertă (excedent) de ' + Math.abs(diff).toFixed(1) + ' buc. Acesta e efectul unui preț podea.';
    }
    citire.textContent = mesaj;
  }

  slider.addEventListener('input', () => recalc(Number(slider.value)));
  btnEchilibru.addEventListener('click', () => { slider.value = String(rez.pret); recalc(rez.pret); });
  btnPlafon.addEventListener('click', () => { const v = Math.max(0.5, rez.pret - 1.5); slider.value = String(v); recalc(v); });
  btnPodea.addEventListener('click', () => { const v = Math.min(maxPret - 0.5, rez.pret + 1.5); slider.value = String(v); recalc(v); });

  recalc(rez.pret);
  return wrap;
}

// ---------------------------------------------------------------------
// Diagrama statica: surplusul consumatorului si al producatorului
// Piata-exemplu (aleasa special, cu oferta trecand prin origine, ca sa
// iasa doua triunghiuri curate): Ce(Q) = 90 - 3P, Of(Q) = 6P
// →  Pe = 10, Qe = 60, CS = 600, PS = 300
// ---------------------------------------------------------------------
function buildSurplusDiagram() {
  const maxPret = 30, maxCant = 100;
  const puncte = [];
  for (let p = 0; p <= maxPret; p += 2) {
    puncte.push({ pret: p, cerere: Math.max(90 - 3 * p, 0), oferta: 6 * p });
  }
  const rez = calcEchilibru(90, 3, 0, 6);
  const g = creazaGraficBaza(maxPret, maxCant, { aria: 'Graficul surplusului consumatorului si al producatorului' });

  const bottomY = g.top + g.chartH;
  const xPe = g.sx(rez.pret), yQe = g.sy(rez.cantitate);
  const xPmax = g.sx(maxPret), xZero = g.sx(0);

  const poligonCS = elNS('polygon', { points: xPmax + ',' + bottomY + ' ' + xPe + ',' + bottomY + ' ' + xPe + ',' + yQe, fill: 'var(--accent)', 'fill-opacity': '0.18', stroke: 'none' });
  const poligonPS = elNS('polygon', { points: xZero + ',' + bottomY + ' ' + xPe + ',' + bottomY + ' ' + xPe + ',' + yQe, fill: 'var(--mark)', 'fill-opacity': '0.22', stroke: 'none' });
  g.svg.appendChild(poligonCS);
  g.svg.appendChild(poligonPS);

  g.svg.appendChild(elNS('polyline', { fill: 'none', stroke: 'var(--accent)', 'stroke-width': 2.5, points: puncte.map(p => g.sx(p.pret) + ',' + g.sy(p.cerere)).join(' ') }));
  g.svg.appendChild(elNS('polyline', { fill: 'none', stroke: 'var(--bad)', 'stroke-width': 2.5, points: puncte.map(p => g.sx(p.pret) + ',' + g.sy(Math.min(p.oferta, maxCant))).join(' ') }));

  g.svg.appendChild(elNS('line', { x1: g.left, y1: yQe, x2: xPe, y2: yQe, stroke: 'var(--mark)', 'stroke-width': 1, 'stroke-dasharray': '3 3' }));
  g.svg.appendChild(elNS('line', { x1: xPe, y1: yQe, x2: xPe, y2: bottomY, stroke: 'var(--mark)', 'stroke-width': 1, 'stroke-dasharray': '3 3' }));
  g.svg.appendChild(elNS('circle', { cx: xPe, cy: yQe, r: 5, fill: 'var(--mark)' }));
  const labelE = elNS('text', { x: xPe + 8, y: yQe - 8, 'font-family': 'var(--font-display)', 'font-weight': 600, 'font-size': 14, fill: 'var(--mark)' });
  labelE.textContent = 'E';
  g.svg.appendChild(labelE);

  const wrap = el('div', 'diagrama');
  wrap.appendChild(g.svg);
  const legenda = el('div', 'legenda');
  legenda.appendChild(legendItem('var(--accent)', 'Surplusul consumatorului'));
  legenda.appendChild(legendItem('var(--mark)', 'Surplusul producătorului'));
  wrap.appendChild(legenda);

  const surplusBox = el('div', 'mini-sim__surplus');
  const cs = el('div');
  const csStrong = el('strong', '', '600 u.u.'); cs.appendChild(csStrong); cs.appendChild(el('span', '', 'Surplusul consumatorului'));
  const ps = el('div');
  const psStrong = el('strong', '', '300 u.u.'); ps.appendChild(psStrong); ps.appendChild(el('span', '', 'Surplusul producătorului'));
  const total = el('div');
  const totalStrong = el('strong', '', '900 u.u.'); total.appendChild(totalStrong); total.appendChild(el('span', '', 'Surplusul total'));
  surplusBox.appendChild(cs); surplusBox.appendChild(ps); surplusBox.appendChild(total);
  wrap.appendChild(surplusBox);

  return wrap;
}

// ---------------------------------------------------------------------
// I. Teste grila
// ---------------------------------------------------------------------
function buildQuizGrila(item, idx) {
  const card = el('div', 'card');
  card.appendChild(el('p', 'card__intrebare', (idx + 1) + '. ' + item.intrebare));

  const optWrap = el('div', 'optiuni');
  const verifBtn = el('button', 'buton', 'Verifică');
  verifBtn.disabled = true;
  const feedback = document.createElement('div');

  let selectat = null, rezolvat = false;
  const butoane = [];
  item.optiuni.forEach((text, i) => {
    const btn = el('button', 'optiune', String.fromCharCode(97 + i) + ') ' + text);
    btn.addEventListener('click', () => {
      if (rezolvat) return;
      selectat = i;
      butoane.forEach((b, j) => b.classList.toggle('selectata', j === i));
      verifBtn.disabled = false;
    });
    butoane.push(btn);
    optWrap.appendChild(btn);
  });

  verifBtn.addEventListener('click', () => {
    if (selectat === null || rezolvat) return;
    rezolvat = true;
    const corect = selectat === item.corect;
    butoane.forEach((b, i) => {
      b.disabled = true;
      if (i === item.corect) b.classList.add('corecta');
      else if (i === selectat) b.classList.add('gresita');
    });
    verifBtn.disabled = true;
    feedback.className = 'feedback ' + (corect ? 'corect' : 'gresit');
    feedback.textContent = (corect ? 'Corect. ' : 'Nu e chiar așa. ') + item.explicatie;
    inregistreazaScor(corect);
  });

  card.appendChild(optWrap);
  card.appendChild(verifBtn);
  card.appendChild(feedback);
  return card;
}

// ---------------------------------------------------------------------
// II. Adevarat / Fals
// ---------------------------------------------------------------------
function buildQuizAF(item, idx) {
  const card = el('div', 'card');
  card.appendChild(el('p', 'card__intrebare', (idx + 1) + '. ' + item.enunt));
  const wrap = el('div', 'af-butoane');
  const btnA = el('button', 'af-buton', 'Adevărat');
  const btnF = el('button', 'af-buton', 'Fals');
  wrap.appendChild(btnA);
  wrap.appendChild(btnF);
  const feedback = document.createElement('div');

  let rezolvat = false;
  function raspunde(valoare, btnAles) {
    if (rezolvat) return;
    rezolvat = true;
    const corect = valoare === item.corect;
    btnA.disabled = true;
    btnF.disabled = true;
    (item.corect ? btnA : btnF).classList.add('corecta');
    if (!corect) btnAles.classList.add('gresita');
    feedback.className = 'feedback ' + (corect ? 'corect' : 'gresit');
    feedback.textContent = (corect ? 'Corect. ' : 'Nu e chiar așa. ') + item.explicatie;
    inregistreazaScor(corect);
  }
  btnA.addEventListener('click', () => raspunde(true, btnA));
  btnF.addEventListener('click', () => raspunde(false, btnF));

  card.appendChild(wrap);
  card.appendChild(feedback);
  return card;
}

// ---------------------------------------------------------------------
// III. Probleme numerice
// ---------------------------------------------------------------------
function buildQuizProblema(item, idx) {
  const card = el('div', 'card');
  card.appendChild(el('p', 'card__intrebare', (idx + 1) + '. ' + item.enunt));

  const wrap = el('div', 'problema-input');
  const input = document.createElement('input');
  input.type = 'number';
  input.step = 'any';
  input.placeholder = 'răspuns';
  wrap.appendChild(input);
  if (item.unitate) wrap.appendChild(el('span', 'unitate', item.unitate));
  const verifBtn = el('button', 'buton', 'Verifică');
  verifBtn.style.marginTop = '0';
  verifBtn.disabled = true;
  wrap.appendChild(verifBtn);
  const feedback = document.createElement('div');

  input.addEventListener('input', () => { verifBtn.disabled = input.value === ''; });
  let rezolvat = false;
  verifBtn.addEventListener('click', () => {
    if (rezolvat || input.value === '') return;
    rezolvat = true;
    const val = Number(input.value);
    const corect = Math.abs(val - item.corect) <= item.toleranta;
    input.disabled = true;
    verifBtn.disabled = true;
    feedback.className = 'feedback ' + (corect ? 'corect' : 'gresit');
    feedback.textContent = (corect ? 'Corect. ' : ('Răspunsul corect este ' + item.corect + ' ' + item.unitate + '. ')) + item.explicatie;
    inregistreazaScor(corect);
  });

  card.appendChild(wrap);
  card.appendChild(feedback);
  return card;
}

// ---------------------------------------------------------------------
// IV. Simulatorul cerere-oferta
// ---------------------------------------------------------------------
function buildSliderRow(labelTxt, onChange) {
  const row = el('div', 'slider-row');
  const label = document.createElement('label');
  label.appendChild(el('span', '', labelTxt));
  const spanVal = el('span', '', '0');
  label.appendChild(spanVal);
  row.appendChild(label);
  const input = document.createElement('input');
  input.type = 'range'; input.min = -40; input.max = 40; input.step = 5; input.value = 0;
  input.addEventListener('input', () => {
    const v = Number(input.value);
    spanVal.textContent = v > 0 ? ('+' + v) : ('' + v);
    onChange(v);
  });
  row.appendChild(input);
  return row;
}

function buildSimulator() {
  const wrap = el('div', 'simulator');
  wrap.appendChild(el('p', 'simulator__nota', 'Mișcă cererea (de ex. o creștere a venitului) sau oferta (de ex. o taxă nouă) și urmărește cum se schimbă prețul și cantitatea de echilibru.'));

  const width = 400, height = 300, left = 46, right = 10, top = 22, bottom = 30;
  const chartW = width - left - right, chartH = height - top - bottom;

  const svg = elNS('svg', { width: '100%', viewBox: '0 0 ' + width + ' ' + height, role: 'img', 'aria-label': 'Graficul cererii si ofertei, cu punctul de echilibru' });

  for (let i = 1; i < 5; i++) {
    const gy = top + (chartH / 5) * i;
    svg.appendChild(elNS('line', { x1: left, y1: gy, x2: left + chartW, y2: gy, stroke: 'var(--surface-2)', 'stroke-width': 1 }));
  }
  for (let i = 1; i < 6; i++) {
    const gx = left + (chartW / 6) * i;
    svg.appendChild(elNS('line', { x1: gx, y1: top, x2: gx, y2: top + chartH, stroke: 'var(--surface-2)', 'stroke-width': 1 }));
  }

  svg.appendChild(elNS('line', { x1: left, y1: top, x2: left, y2: top + chartH, stroke: 'var(--text-muted)', 'stroke-width': 1 }));
  svg.appendChild(elNS('line', { x1: left, y1: top + chartH, x2: left + chartW, y2: top + chartH, stroke: 'var(--text-muted)', 'stroke-width': 1 }));
  const labelCant = elNS('text', { x: left, y: 14, 'font-size': 11, fill: 'var(--text-muted)' });
  labelCant.textContent = 'Cantitate (buc.)';
  const labelPret = elNS('text', { x: left + chartW, y: height - 12, 'font-size': 11, fill: 'var(--text-muted)', 'text-anchor': 'end' });
  labelPret.textContent = 'Preț (u.m.)';
  svg.appendChild(labelCant); svg.appendChild(labelPret);

  const linieCerere = elNS('polyline', { fill: 'none', stroke: 'var(--accent)', 'stroke-width': 2.5 });
  const linieOferta = elNS('polyline', { fill: 'none', stroke: 'var(--bad)', 'stroke-width': 2.5 });
  svg.appendChild(linieCerere); svg.appendChild(linieOferta);

  const dashY = elNS('line', { stroke: 'var(--mark)', 'stroke-width': 1, 'stroke-dasharray': '3 3' });
  const dashX = elNS('line', { stroke: 'var(--mark)', 'stroke-width': 1, 'stroke-dasharray': '3 3' });
  svg.appendChild(dashY); svg.appendChild(dashX);

  const punctE = elNS('circle', { r: 5, fill: 'var(--mark)' });
  svg.appendChild(punctE);
  const labelE = elNS('text', { 'font-family': 'var(--font-display)', 'font-weight': 600, 'font-size': 14, fill: 'var(--mark)' });
  labelE.textContent = 'E';
  svg.appendChild(labelE);

  wrap.appendChild(svg);

  const legenda = el('div', 'legenda');
  legenda.appendChild(legendItem('var(--accent)', 'Cerere'));
  legenda.appendChild(legendItem('var(--bad)', 'Ofertă'));
  legenda.appendChild(legendItem('var(--mark)', 'Echilibru (E)'));
  wrap.appendChild(legenda);

  const citire = el('div', 'simulator__citire');
  const boxPret = document.createElement('div');
  const strongPret = document.createElement('strong');
  boxPret.appendChild(strongPret); boxPret.appendChild(el('span', '', 'Preț echilibru (u.m.)'));
  const boxCant = document.createElement('div');
  const strongCant = document.createElement('strong');
  boxCant.appendChild(strongCant); boxCant.appendChild(el('span', '', 'Cantitate echilibru (buc.)'));
  citire.appendChild(boxPret); citire.appendChild(boxCant);
  wrap.appendChild(citire);

  let deplasareCerere = 0, deplasareOferta = 0;
  function recalculeaza() {
    const a = 200 + deplasareCerere, b = 4, c = 50 + deplasareOferta, d = 6;
    const rez = calcEchilibru(a, b, c, d);
    const puncte = puncteCurbe(a, b, c, d);
    const maxPret = puncte[puncte.length - 1].pret || 1;
    const maxCant = Math.max.apply(null, puncte.map(p => Math.max(p.cerere, p.oferta)).concat([1]));
    const sx = p => left + (p / maxPret) * chartW;
    const sy = q => top + chartH - (q / maxCant) * chartH;
    linieCerere.setAttribute('points', puncte.map(p => sx(p.pret) + ',' + sy(p.cerere)).join(' '));
    linieOferta.setAttribute('points', puncte.map(p => sx(p.pret) + ',' + sy(p.oferta)).join(' '));
    const ex = sx(rez.pret), ey = sy(rez.cantitate);
    dashY.setAttribute('x1', left); dashY.setAttribute('y1', ey); dashY.setAttribute('x2', ex); dashY.setAttribute('y2', ey);
    dashX.setAttribute('x1', ex); dashX.setAttribute('y1', ey); dashX.setAttribute('x2', ex); dashX.setAttribute('y2', top + chartH);
    punctE.setAttribute('cx', ex); punctE.setAttribute('cy', ey);
    labelE.setAttribute('x', ex + 9); labelE.setAttribute('y', ey - 8);
    strongPret.textContent = rez.pret;
    strongCant.textContent = rez.cantitate;
  }

  const sliders = el('div', 'simulator__sliders');
  sliders.appendChild(buildSliderRow('Deplasare cerere', v => { deplasareCerere = v; recalculeaza(); }));
  sliders.appendChild(buildSliderRow('Deplasare ofertă', v => { deplasareOferta = v; recalculeaza(); }));
  wrap.appendChild(sliders);

  recalculeaza();
  return wrap;
}
