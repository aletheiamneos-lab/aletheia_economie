<!doctype html>
<html lang="ro">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Capitolul 15 · Venitul, consumul și investițiile</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,500;8..60,600&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet" />
<style>
:root {
  --bg: #f5f6f4;
  --surface: #ffffff;
  --surface-2: #eef1ed;
  --border: #d8dcd6;
  --text: #1b2420;
  --text-muted: #5c6660;
  --accent: #1e3a5f;
  --accent-soft: #e7edf3;
  --good: #1f7a4d;
  --good-bg: #e8f5ee;
  --bad: #b23a2e;
  --bad-bg: #fbeae8;
  --mark: #a8790f;
  --font-display: "Source Serif 4", Georgia, serif;
  --font-body: "Inter", system-ui, sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, monospace;
}
* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; background: var(--bg); color: var(--text); font-family: var(--font-body); }
#app { max-width: 800px; margin: 0 auto; padding: 0 20px 90px; }
h1, h2, h3 { font-weight: 600; color: var(--text); margin: 0; }
p { line-height: 1.7; color: var(--text); margin: 0 0 12px; }
p:last-child { margin-bottom: 0; }

.toc { border: 1px solid var(--border); border-radius: 10px; padding: 16px 20px; margin-top: 20px; background: var(--surface); }
.toc__titlu { font-family: var(--font-mono); font-size: 11.5px; text-transform: uppercase; letter-spacing: 0.06em; color: var(--text-muted); margin-bottom: 8px; }
.toc ol { margin: 0; padding-left: 18px; columns: 2; column-gap: 24px; }
.toc li { font-size: 13.5px; margin-bottom: 5px; break-inside: avoid; }
.toc a { color: var(--accent); text-decoration: none; }
.toc a:hover { text-decoration: underline; }
@media (max-width: 560px) { .toc ol { columns: 1; } }

.scor-bar { position: sticky; top: 0; z-index: 10; padding: 10px 16px 12px; margin: 0 -20px; background: rgba(245, 246, 244, 0.95); backdrop-filter: blur(4px); border-bottom: 1px solid var(--border); }
.scor-bar__row { display: flex; align-items: center; justify-content: space-between; gap: 16px; margin-bottom: 6px; }
.scor-bar__label { font-family: var(--font-mono); font-size: 12.5px; color: var(--text-muted); white-space: nowrap; }
.scor-bar__track { height: 5px; border-radius: 3px; background: var(--surface-2); overflow: hidden; display: flex; }
.scor-bar__fill-good { background: var(--good); height: 100%; }
.scor-bar__fill-bad { background: var(--bad); height: 100%; }

.header { padding: 30px 0 6px; }
.header__eyebrow { font-family: var(--font-mono); font-size: 12.5px; color: var(--accent); letter-spacing: 0.06em; text-transform: uppercase; }
.header__titlu { font-family: var(--font-display); font-weight: 600; font-size: 30px; line-height: 1.3; margin-top: 6px; }

.obiective { border: 1px solid var(--border); border-radius: 10px; padding: 18px 22px; margin-top: 20px; background: var(--surface); }
.obiective__titlu { font-family: var(--font-display); font-weight: 600; font-size: 15px; color: var(--accent); margin-bottom: 10px; }
.obiective ul { margin: 0; padding-left: 18px; }
.obiective li { color: var(--text-muted); margin-bottom: 6px; font-size: 14.5px; }

.sectiune-titlu { font-family: var(--font-display); font-weight: 600; font-size: 22px; color: var(--text); margin: 44px 0 4px; padding-bottom: 8px; border-bottom: 2px solid var(--accent); }

.teorie-box { border: 1px solid var(--border); border-radius: 10px; padding: 20px 24px; margin-top: 16px; background: var(--surface); scroll-margin-top: 76px; }
.teorie-box__titlu { font-family: var(--font-display); font-weight: 600; font-size: 17px; color: var(--text); cursor: pointer; display: flex; align-items: baseline; gap: 10px; justify-content: space-between; }
.teorie-box__nr { font-family: var(--font-mono); font-size: 13px; color: var(--accent); font-weight: 500; }
.teorie-box__chevron { font-family: var(--font-mono); color: var(--text-muted); font-size: 14px; }
.teorie-box__body { margin-top: 12px; }
.teorie-box ul { margin: 8px 0 12px; padding-left: 18px; }
.teorie-box li { margin-bottom: 6px; font-size: 14.5px; color: var(--text); }

.exemplu { font-family: var(--font-body); font-style: italic; background: var(--accent-soft); border-left: 3px solid var(--accent); border-radius: 0 8px 8px 0; padding: 10px 16px; margin-top: 10px; font-size: 14px; color: var(--text); }
.exemplu__eticheta { display: block; font-style: normal; font-family: var(--font-mono); font-size: 11.5px; text-transform: uppercase; letter-spacing: 0.04em; color: var(--accent); margin-bottom: 3px; }

.formula { font-family: var(--font-mono); background: var(--surface-2); border-radius: 8px; padding: 9px 14px; margin-top: 10px; font-size: 13.5px; }
.formula__nume { display: block; font-family: var(--font-body); font-size: 12px; color: var(--text-muted); margin-bottom: 2px; }

.clasificare { margin-top: 16px; }
.clasificare__criteriu { font-family: var(--font-mono); font-size: 12px; color: var(--text-muted); margin-bottom: 4px; }
.clasificare__definitii { margin-top: 10px; }
.clasificare__definitii p { font-size: 13.5px; margin: 0 0 6px; color: var(--text); }
.clasificare__definitii p:last-child { margin-bottom: 0; }
.clasificare__definitii strong { color: var(--accent); }

.mini-calc { margin-top: 14px; padding: 14px 16px; border: 1px dashed var(--accent); border-radius: 8px; background: var(--accent-soft); }
.mini-calc__titlu { font-family: var(--font-mono); font-size: 11.5px; text-transform: uppercase; letter-spacing: 0.04em; color: var(--accent); margin-bottom: 10px; }
.mini-calc__randuri { display: flex; gap: 18px; flex-wrap: wrap; margin-bottom: 10px; }
.mini-calc__randuri label { display: flex; flex-direction: column; gap: 4px; font-size: 12.5px; color: var(--text-muted); font-family: var(--font-mono); }
.mini-calc__randuri input { font-family: var(--font-mono); font-size: 14px; padding: 6px 10px; border: 1px solid var(--border); border-radius: 6px; width: 100px; background: var(--surface); color: var(--text); }
.mini-calc__rezultat { font-family: var(--font-mono); font-size: 13.5px; color: var(--text); line-height: 1.8; }
.mini-calc__rezultat strong { color: var(--accent); }

.diagrama { margin-top: 12px; }

.nota-legatura { font-size: 13.5px; color: var(--text-muted); margin-top: 10px; padding-top: 10px; border-top: 1px dashed var(--border); }
.nota-legatura a { color: var(--accent); }

.exercitiu-eyebrow { font-family: var(--font-display); font-weight: 600; font-size: 20px; color: var(--accent); margin-top: 44px; margin-bottom: 4px; scroll-margin-top: 76px; }
.exercitiu-sub { color: var(--text-muted); font-size: 13.5px; margin-bottom: 6px; }

.card { border: 1px solid var(--border); border-radius: 10px; padding: 18px 22px; margin-top: 14px; background: var(--surface); }
.card__intrebare { font-size: 15px; margin-bottom: 14px; margin-top: 0; font-weight: 500; }

.optiuni { display: flex; flex-direction: column; gap: 8px; }
.optiune { display: flex; align-items: center; gap: 10px; padding: 9px 12px; border: 1px solid var(--border); border-radius: 8px; cursor: pointer; font-size: 14.5px; background: transparent; color: var(--text); text-align: left; font-family: var(--font-body); }
.optiune:hover:not(:disabled) { border-color: var(--accent); }
.optiune.selectata { border-color: var(--accent); background: var(--accent-soft); }
.optiune.corecta { border-color: var(--good); background: var(--good-bg); color: var(--good); }
.optiune.gresita { border-color: var(--bad); background: var(--bad-bg); color: var(--bad); }

.buton { font-family: var(--font-body); font-weight: 600; font-size: 14px; padding: 9px 18px; border-radius: 8px; border: 1.5px solid var(--accent); background: transparent; color: var(--accent); cursor: pointer; margin-top: 14px; }
.buton:hover:not(:disabled) { background: var(--accent-soft); }
.buton:disabled { opacity: 0.4; cursor: not-allowed; }

.af-butoane { display: flex; gap: 10px; }
.af-buton { flex: 1; padding: 10px; border-radius: 8px; border: 1px solid var(--border); background: transparent; color: var(--text); font-family: var(--font-body); font-size: 14px; cursor: pointer; }
.af-buton.corecta { border-color: var(--good); background: var(--good-bg); color: var(--good); }
.af-buton.gresita { border-color: var(--bad); background: var(--bad-bg); color: var(--bad); }

.problema-input { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.problema-input input { font-family: var(--font-mono); font-size: 15px; padding: 8px 12px; border-radius: 8px; border: 1px solid var(--border); background: var(--surface-2); color: var(--text); width: 120px; }
.problema-input input:focus { outline: 2px solid var(--accent); border-color: var(--accent); }
.unitate { color: var(--text-muted); font-family: var(--font-mono); font-size: 13px; }

.feedback { margin-top: 12px; padding: 10px 14px; border-radius: 8px; font-size: 14px; line-height: 1.55; }
.feedback.corect { background: var(--good-bg); color: var(--good); }
.feedback.gresit { background: var(--bad-bg); color: var(--bad); }

.asociere-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px 20px; }
.asociere-coloana { display: flex; flex-direction: column; gap: 8px; }
@media (max-width: 480px) { .asociere-grid { grid-template-columns: 1fr; } }

.simulator { border: 1px solid var(--border); border-radius: 10px; padding: 20px 24px; margin-top: 14px; background: var(--surface); }
.simulator__nota { margin-top: 0; color: var(--text-muted); font-size: 14px; }
.simulator__sliders { display: flex; flex-direction: column; gap: 16px; margin-top: 16px; }
.slider-row label { display: flex; justify-content: space-between; font-size: 13.5px; color: var(--text-muted); margin-bottom: 6px; font-family: var(--font-mono); }
.slider-row input[type="range"] { width: 100%; accent-color: var(--accent); }
.simulator__citire { display: flex; gap: 20px; margin-top: 16px; font-family: var(--font-mono); flex-wrap: wrap; }
.simulator__citire strong { color: var(--accent); font-size: 18px; display: block; }
.simulator__citire span { color: var(--text-muted); font-size: 11.5px; }
.legenda { display: flex; gap: 18px; margin-top: 10px; font-size: 12.5px; color: var(--text-muted); flex-wrap: wrap; }
.legenda span.item { display: inline-flex; align-items: center; gap: 6px; }
.punct-legenda { width: 10px; height: 10px; border-radius: 50%; display: inline-block; }

@media (max-width: 480px) {
  .header__titlu { font-size: 24px; }
}
</style>
</head>
<body>
<div id="app"></div>

<script>
const DATA = {
  capitol: {
    numar: 15,
    titlu: 'Venitul, consumul și investițiile',
    obiective: [
      'Să înțelegi conținutul indicatorilor macroeconomici și relațiile dintre aceștia',
      'Să calculezi ratele medii și marginale ale consumului și economisirii',
      'Să explici legea psihologică fundamentală a lui Keynes',
      'Să evidențiezi rolul investițiilor și al multiplicatorului investițiilor în economie',
      'Să rezolvi aplicații practice privind acești indicatori'
    ]
  },
  teorie: [
    {
      id: 'indicatori-macroeconomici', nr: '1', titlu: 'Indicatorii macroeconomici',
      text: [
        'Indicatorii macroeconomici (agregați) reflectă locul unei economii naționale în economia mondială - se calculează prin însumarea valorii bunurilor economice finale produse la nivel micro și mezoeconomic. Principalii indicatori: PGB, PIB, PIN, PNB, PNN, venitul național, venitul personal, venitul disponibil.',
        'Prețurile pieței (Pp), suportate de consumatori, diferă de prețurile factorilor (Pf), suportate de producători: Pp = Pf + Izin, unde Izin (impozitele indirecte nete) = impozitele indirecte totale - subvențiile de exploatare.'
      ],
      puncteCheie: [
        { termen: 'PGB (produsul global brut)', descriere: 'valoarea totală a bunurilor economice obținute într-o țară, într-un an' },
        { termen: 'PIB (produsul intern brut)', descriere: 'PIB = PGB - CI (consumul intermediar); valoarea bunurilor finale produse în interiorul țării' },
        { termen: 'PIN (produsul intern net)', descriere: 'PIN = PIB - A (amortizarea)' },
        { termen: 'PNB (produsul național brut)', descriere: 'PNB = PIB ± SREI (soldul relațiilor economice internaționale)' }
      ],
      exemple: [
        'Structura PIB, după destinația bunurilor finale: PIB = CP + CG + IB + Exn, unde CP=consum privat, CG=consum guvernamental, IB=investiția brută, Exn=exportul net (export-import).'
      ],
      formule: [
        { nume: 'Produsul intern brut', formula: 'PIB = PGB - CI' },
        { nume: 'Structura PIB', formula: 'PIB = CP + CG + IB + Exn' },
        { nume: 'Deflatorul PIB', formula: 'Deflator PIB = (PIB nominal/PIB real) x 100' }
      ]
    },
    {
      id: 'venit-consum-economisire', nr: '2', titlu: 'Venitul, consumul și economisirea',
      text: [
        'Consumul (C) reprezintă cheltuielile agenților economici pentru achiziționarea de bunuri și servicii destinate satisfacerii nevoilor. Economiile (E) reprezintă excedentul de venit peste cheltuielile de consum: E = VD - C.',
        'J.M. Keynes a formulat legea psihologică fundamentală privind înclinația spre consum și economisire: pe măsură ce venitul disponibil (VD) crește, atât consumul, cât și economiile cresc, dar economiile cresc mai repede decât venitul, iar venitul mai repede decât consumul: Δ%E > Δ%VD > Δ%C.'
      ],
      clasificari: [
        { criteriu: 'Factorii care influențează consumul și economiile', categorii: [
          { nume: 'Obiectivi', definitie: 'mărimea venitului real, așteptările privind venitul viitor, creditul de consum, politica fiscală' },
          { nume: 'Subiectivi (psihologici)', definitie: 'dorința de rezerve pentru situații neprevăzute, dorința de a beneficia de dobânzi, dorința de a investi, dorința de a lăsa moștenire' }
        ] }
      ],
      exemple: [],
      formule: [
        { nume: 'Rata medie a consumului', formula: 'c = (C/VD) x 100' },
        { nume: 'Rata marginală spre consum', formula: 'c\u2019 = ΔC/ΔVD' },
        { nume: 'Rata medie a economiilor', formula: 'e = (E/VD) x 100' },
        { nume: 'Rata marginală spre economii', formula: 'e\u2019 = ΔE/ΔVD' },
        { nume: 'Relația fundamentală', formula: 'c + e = 1 (100%)   și   c\u2019 + e\u2019 = 1' }
      ],
      calculator: 'consumEconomii'
    },
    {
      id: 'investitiile', nr: '3', titlu: 'Investițiile și multiplicatorul lor',
      text: [
        'Investițiile reprezintă partea din venitul disponibil cheltuită pentru achiziționarea bunurilor de capital, în scopul formării și creșterii dimensiunilor capitalului existent, precum și modernizării lui.',
        'Multiplicatorul investițiilor (K) reflectă cu cât sporește venitul disponibil (ΔVD) în viitor, la creșterea cu o unitate a investițiilor (ΔI) - practic, de câte ori se multiplică o investiție inițială, pe măsură ce banii cheltuiți circulă prin economie, în runde succesive.'
      ],
      clasificari: [
        { criteriu: 'Formele investițiilor, după destinație și sursă', categorii: [
          { nume: 'Investiții nete (IN)', definitie: 'contribuie la formarea netă a capitalului - sporirea capitalului fix și a stocurilor; sursă: venit, profit, economii' },
          { nume: 'Investiții de înlocuire (II)', definitie: 'înlocuiesc capitalul fix uzat; sursă: fondul de amortizare' },
          { nume: 'Investiții brute (IB)', definitie: 'IB = IN + II - contribuie la formarea brută a capitalului' }
        ] }
      ],
      puncteCheie: [
        'Factorii care influențează investițiile: volumul venitului și al economiilor, cererea de bunuri, rata dobânzii, rata rentabilității firmei, așteptările întreprinzătorilor',
        'Efectele creșterii investițiilor, la nivelul firmei: mai multe locuri de muncă, modernizare, productivitate mai mare',
        'Efectele creșterii investițiilor, la nivelul economiei naționale: reducerea șomajului și a inflației, creștere economică, calitate a vieții mai bună'
      ],
      exemple: [
        'Într-o economie închisă, fără intervenția statului, economiile (E) sunt egale, teoretic, cu investițiile (I): VD = C + I, iar în dinamică, ΔVD = ΔC + ΔI.'
      ],
      formule: [
        { nume: 'Investițiile brute', formula: 'IB = IN + II' },
        { nume: 'Multiplicatorul investițiilor', formula: 'K = ΔVD/ΔI = 1/e\u2019 = 1/(1-c\u2019)' },
        { nume: 'Sporul venitului disponibil', formula: 'ΔVD = K x ΔI' }
      ],
      notaLegatura: { href: '#sect-explorator-multiplicator', text: 'Explorează interactiv cum funcționează multiplicatorul, rundă cu rundă, în secțiunea V, mai jos.' }
    }
  ],
  grila: [
    { intrebare: 'PIB include:', optiuni: ['amortizarea', 'consumul intermediar de materii prime', 'bunurile destinate autoconsumului', 'comerțul cu droguri (economia subterană)'], corect: 0, explicatie: 'PIB e un indicator BRUT (include amortizarea); consumul intermediar, autoconsumul și activitățile ilegale nu se includ în PIB.' },
    { intrebare: 'Reprezintă o investiție, în sens economic:', optiuni: ['cumpărarea unei case de locuit, pentru uz propriu', 'achiziționarea de acțiuni la bursă, ca simplu plasament financiar', 'cumpărarea unui teren neconstruit', 'achiziționarea de utilaje necesare producției'], corect: 3, explicatie: 'Investiția, în sens economic, înseamnă achiziționarea de bunuri de capital tehnic pentru producție - nu simple plasamente financiare sau achiziții de bunuri deja existente.' },
    { intrebare: 'Multiplicatorul investițiilor (K) este:', optiuni: ['direct proporțional cu înclinația marginală spre economii', 'invers proporțional cu înclinația marginală spre economii', 'independent de înclinația marginală spre economii sau consum', 'egal întotdeauna cu 1'], corect: 1, explicatie: 'K = 1/e\u2019 - cu cât înclinația marginală spre economii (e\u2019) e mai mică, cu atât multiplicatorul K e mai mare (relație inversă).' },
    { intrebare: 'Legea psihologică fundamentală a lui Keynes arată că, atunci când venitul crește:', optiuni: ['consumul crește mai repede decât venitul', 'economiile cresc mai repede decât venitul, iar acesta mai repede decât consumul', 'consumul și economiile cresc în aceeași proporție cu venitul', 'doar consumul crește, economiile rămân constante'], corect: 1, explicatie: 'Δ%E > Δ%VD > Δ%C - economiile cresc proporțional mai mult decât venitul, iar venitul mai mult decât consumul.' },
    { intrebare: 'Investițiile de înlocuire au ca sursă principală:', optiuni: ['profitul reinvestit', 'amortizarea', 'creditul bancar', 'emisiunea de acțiuni'], corect: 1, explicatie: 'Investițiile de înlocuire sunt destinate înlocuirii capitalului fix uzat, iar sursa lor principală este fondul de amortizare.' }
  ],
  af: [
    { enunt: 'Multiplicatorul investițiilor este invers proporțional cu înclinația marginală spre economii.', corect: true, explicatie: 'Da - K = 1/e\u2019.' },
    { enunt: 'Când venitul depășește cheltuielile de consum, există fenomenul de dezeconomisire.', corect: false, explicatie: 'Dimpotrivă - când venitul depășește consumul, apare economisirea (E=VD-C>0). Dezeconomisirea ar însemna consum mai mare decât venitul.' },
    { enunt: 'Politica fiscală este un factor obiectiv care influențează consumul și economiile.', corect: true, explicatie: 'Da - politica fiscală (impozitele) e un factor obiectiv, alături de venitul real, creditul de consum etc.' },
    { enunt: 'Prețurile curente de piață sunt influențate de fenomenele inflaționiste.', corect: true, explicatie: 'Da - de aceea se face distincția între prețuri nominale (curente, afectate de inflație) și prețuri reale (constante, neafectate).' },
    { enunt: 'Investițiile brute sunt egale cu suma dintre investițiile nete și cele de înlocuire.', corect: true, explicatie: 'Da - IB = IN + II.' }
  ],
  probleme: [
    { enunt: 'În condițiile unei rate a inflației de 25%, PIB nominal crește cu 50%. Dacă PIBr(0) este 80.000 u.m., cât este PIBr(1)?', unitate: 'u.m.', corect: 96000, toleranta: 500, explicatie: 'I(PIB nominal)=150%, Deflator=I(Ip)=125%. I(PIBreal)=(150/125)x100=120%. PIBr(1)=80.000x1,20=96.000 u.m.' },
    { enunt: 'Venitul personal este 800 u.m., iar impozitul pe venitul personal este 200 u.m. Dacă s-au economisit 200 u.m., care este rata medie a consumului (c)?', unitate: '', corect: 0.667, toleranta: 0.02, explicatie: 'VD = 800-200 = 600 u.m. C = VD-E = 600-200 = 400 u.m. c = C/VD = 400/600 = 2/3 ≈ 0,667.' },
    { enunt: 'Venitul disponibil sporește cu 5.000 u.m., iar cheltuielile de consum cresc de 1,5 ori, ajungând la 6.000 u.m. Care este multiplicatorul investițiilor (K)?', unitate: '', corect: 1.667, toleranta: 0.05, explicatie: 'C0 = 6.000/1,5 = 4.000 u.m. ΔC = 6.000-4.000 = 2.000 u.m. c\u2019 = ΔC/ΔVD = 2.000/5.000 = 0,4. e\u2019 = 1-0,4 = 0,6. K = 1/e\u2019 = 1/0,6 ≈ 1,667.' }
  ],
  asociere: [
    {
      instructiune: 'Asociază fiecare termen cu definiția corectă (atenție - sunt mai multe definiții decât termeni).',
      coloanaA: [
        { id: 't1', text: 'PIB' },
        { id: 't2', text: 'PIN' },
        { id: 't3', text: 'PNB' },
        { id: 't4', text: 'Multiplicatorul investițiilor (K)' }

function calculeazaConsumEconomii(VD0, C0, VD1, C1) {
  const E0 = VD0 - C0, E1 = VD1 - C1;
  const c = (C0 / VD0) * 100, e = (E0 / VD0) * 100;
  const dC = C1 - C0, dVD = VD1 - VD0, dE = E1 - E0;
  const cPrime = dC / dVD, ePrime = dE / dVD;
  const K = 1 / ePrime;
  return { E0, E1, c, e, cPrime, ePrime, K };
}

function buildDonutChart(componente) {

function buildConsumEconomiiCalc() {
  const box = el('div', 'mini-calc');
  box.appendChild(el('div', 'mini-calc__titlu', 'Calculator rapid: ratele de consum/economisire și multiplicatorul'));
  const randuri = el('div', 'mini-calc__randuri');
  const inputVD0 = campInput(randuri, 'Venit disponibil inițial (VD0)', 'ex. 100', 100);
  const inputC0 = campInput(randuri, 'Consum inițial (C0)', 'ex. 80', 80);
  box.appendChild(randuri);
  const randuri2 = el('div', 'mini-calc__randuri');
  const inputVD1 = campInput(randuri2, 'Venit disponibil curent (VD1)', 'ex. 125', 125);
  const inputC1 = campInput(randuri2, 'Consum curent (C1)', 'ex. 96', 96);
  box.appendChild(randuri2);
  const chartWrap = el('div', 'diagrama');
  box.appendChild(chartWrap);
  const rezultat = el('div', 'mini-calc__rezultat');
  box.appendChild(rezultat);

  function recalc() {
    const VD0 = Number(inputVD0.value), C0 = Number(inputC0.value), VD1 = Number(inputVD1.value), C1 = Number(inputC1.value);
    if ([inputVD0, inputC0, inputVD1, inputC1].some(i => i.value === '') || [VD0, C0, VD1, C1].some(isNaN) || VD0 === 0 || VD1 === VD0) {
      rezultat.textContent = 'Completează toate valorile (VD0 diferit de 0, VD1 diferit de VD0).';
      chartWrap.innerHTML = '';
      return;
    }
    const r = calculeazaConsumEconomii(VD0, C0, VD1, C1);
    rezultat.innerHTML = '';
    [['c (rata medie a consumului, %)', r.c], ['e (rata medie a economiilor, %)', r.e], ["c' (rata marginală, consum)", r.cPrime], ["e' (rata marginală, economii)", r.ePrime], ['K (multiplicatorul investițiilor)', r.K]].forEach(pair => {
      const div = document.createElement('div');
      div.appendChild(document.createTextNode(pair[0] + ' = '));
      const strong = document.createElement('strong');
      strong.textContent = Math.round(pair[1] * 1000) / 1000;
      div.appendChild(strong);
      rezultat.appendChild(div);
    });
    chartWrap.innerHTML = '';
    chartWrap.appendChild(buildDonutChart([
      { label: 'Consum (C0)', val: C0, culoare: 'var(--accent)' },
      { label: 'Economii (E0)', val: r.E0, culoare: 'var(--good)' }
    ]));
  }
  [inputVD0, inputC0, inputVD1, inputC1].forEach(inp => inp.addEventListener('input', recalc));
  recalc();
  return box;
}

function buildQuizGrila(item, idx) {
  const card = el('div', 'card');
  card.appendChild(el('p', 'card__intrebare', (idx + 1) + '. ' + item.intrebare));
  const optWrap = el('div', 'optiuni');
  const verifBtn = el('button', 'buton', 'Verifică');
  verifBtn.disabled = true;
  const feedback = document.createElement('div');
  let selectat = null, rezolvat = false;
  const butoane = [];
  item.optiuni.forEach((text, i) => {
    const btn = el('button', 'optiune', String.fromCharCode(97 + i) + ') ' + text);
    btn.addEventListener('click', () => {
      if (rezolvat) return;
      selectat = i;
      butoane.forEach((b, j) => b.classList.toggle('selectata', j === i));
      verifBtn.disabled = false;
    });
    butoane.push(btn);
    optWrap.appendChild(btn);
  });
  verifBtn.addEventListener('click', () => {
    if (selectat === null || rezolvat) return;
    rezolvat = true;
    const corect = selectat === item.corect;
    butoane.forEach((b, i) => {
      b.disabled = true;
      if (i === item.corect) b.classList.add('corecta');
      else if (i === selectat) b.classList.add('gresita');
    });
    verifBtn.disabled = true;
    feedback.className = 'feedback ' + (corect ? 'corect' : 'gresit');
    feedback.textContent = (corect ? 'Corect. ' : 'Nu e chiar așa. ') + item.explicatie;
    inregistreazaScor(corect);
  });
  card.appendChild(optWrap); card.appendChild(verifBtn); card.appendChild(feedback);
  return card;

    if (rezolvat || input.value === '') return;
    rezolvat = true;
    const val = Number(input.value);
    const corect = Math.abs(val - item.corect) <= item.toleranta;
    input.disabled = true; verifBtn.disabled = true;
    feedback.className = 'feedback ' + (corect ? 'corect' : 'gresit');
    feedback.textContent = (corect ? 'Corect. ' : ('Răspunsul corect este ' + item.corect + ' ' + item.unitate + '. ')) + item.explicatie;
    inregistreazaScor(corect);
  });
  card.appendChild(wrap); card.appendChild(feedback);
  return card;
}

function buildQuizAsociere(item, idx) {
  const card = el('div', 'card');
  if (item.instructiune) card.appendChild(el('p', 'card__intrebare', (idx + 1) + '. ' + item.instructiune));
  const grid = el('div', 'asociere-grid');
  const colA = el('div', 'asociere-coloana');
  const colB = el('div', 'asociere-coloana');
  grid.appendChild(colA); grid.appendChild(colB);
  card.appendChild(grid);
  const stare = document.createElement('div');
  card.appendChild(stare);
  let selectatId = null, rezolvate = 0;
  const total = item.perechi.length;
  const butoaneA = {};
  function verificaFinal() {
    if (rezolvate === total) {
      stare.className = 'feedback corect';
      stare.textContent = 'Ai asociat corect toate cele ' + total + ' perechi.' + (item.explicatie ? ' ' + item.explicatie : '');
    }
  }
  item.coloanaA.forEach(termen => {
    const btn = el('button', 'optiune', termen.text);
    btn.addEventListener('click', () => {
      if (btn.disabled) return;
      Object.values(butoaneA).forEach(b => b.classList.remove('selectata'));
      selectatId = termen.id;
      btn.classList.add('selectata');
    });
    butoaneA[termen.id] = btn;
    colA.appendChild(btn);
  });
  item.coloanaB.forEach(definitie => {
    const btn = el('button', 'optiune', definitie.text);
    btn.addEventListener('click', () => {
      if (btn.disabled || selectatId === null) return;
      const btnA = butoaneA[selectatId];
      const perecheCorecta = item.perechi.some(p => p.stanga === selectatId && p.dreapta === definitie.id);
      if (perecheCorecta) {
        btnA.classList.remove('selectata'); btnA.classList.add('corecta'); btnA.disabled = true;
        btn.classList.add('corecta'); btn.disabled = true;
        rezolvate++; selectatId = null;
        verificaFinal();
      } else {
        btnA.classList.add('gresita'); btn.classList.add('gresita');
        setTimeout(() => { btnA.classList.remove('selectata', 'gresita'); btn.classList.remove('gresita'); }, 600);
        selectatId = null;
      }
    });
    colB.appendChild(btn);
  });
  return card;
}

// -----------------------------------------------------------------
// V. Explorator: multiplicatorul investitiilor, runda cu runda
// -----------------------------------------------------------------
function buildExploratorMultiplicator() {
  const dI = 100, nRunde = 8;
  const width = 380, height = 260, left = 46, right = 14, top = 18, bottom = 40;
  const chartW = width - left - right, chartH = height - top - bottom;

  const wrap = el('div', 'simulator');
  wrap.appendChild(el('p', 'simulator__nota', 'O investiție inițială de 100 u.m. se cheltuiește, apoi se recheltuiește parțial, în runde succesive - de fiecare dată doar partea "c\u2019" (înclinația marginală spre consum) circulă mai departe. Alege c\u2019 și vezi cum crește, treptat, venitul total generat.'));

  const svg = elNS('svg', { width: '100%', viewBox: '0 0 ' + width + ' ' + height, role: 'img', 'aria-label': 'Rundele succesive de cheltuiala ale multiplicatorului investitiilor' });
  wrap.appendChild(svg);

  const legenda = el('div', 'legenda');
  legenda.appendChild(legendItem('var(--accent)', 'Suma cheltuită în fiecare rundă'));
  wrap.appendChild(legenda);

  const citire = el('div', 'simulator__citire');
  const boxK = document.createElement('div'); const sK = document.createElement('strong'); boxK.appendChild(sK); boxK.appendChild(el('span', '', 'Multiplicatorul K'));
  const boxTotalTeoretic = document.createElement('div'); const sTotalTeoretic = document.createElement('strong'); boxTotalTeoretic.appendChild(sTotalTeoretic); boxTotalTeoretic.appendChild(el('span', '', 'ΔVD teoretic (K x ΔI)'));
  const boxTotalRunde = document.createElement('div'); const sTotalRunde = document.createElement('strong'); boxTotalRunde.appendChild(sTotalRunde); boxTotalRunde.appendChild(el('span', '', 'Total după ' + nRunde + ' runde'));
  citire.appendChild(boxK); citire.appendChild(boxTotalTeoretic); citire.appendChild(boxTotalRunde);
  wrap.appendChild(citire);

  const sliders = el('div', 'simulator__sliders');
  const row = el('div', 'slider-row');
  const label = document.createElement('label');
  label.appendChild(el('span', '', "Înclinația marginală spre consum (c')"));
  const labelVal = el('span', '', '0.8');
  label.appendChild(labelVal);
  row.appendChild(label);
  const slider = document.createElement('input');
  slider.type = 'range'; slider.min = '0.1'; slider.max = '0.9'; slider.step = '0.05'; slider.value = '0.8';
  row.appendChild(slider);
  sliders.appendChild(row);
  wrap.appendChild(sliders);

  function recalc() {
    const cPrime = Number(slider.value);
    labelVal.textContent = cPrime.toFixed(2);
    const K = 1 / (1 - cPrime);
    const runde = [];
    let totalRunde = 0;
    for (let i = 0; i < nRunde; i++) {
      const val = dI * Math.pow(cPrime, i);
      runde.push(val);
      totalRunde += val;
    }
    const maxRunda = runde[0];
    const barW = (chartW / nRunde) * 0.65, gap = (chartW / nRunde) * 0.35;
    const baseY = top + chartH;

    svg.innerHTML = '';
    svg.appendChild(elNS('line', { x1: left, y1: baseY, x2: left + chartW, y2: baseY, stroke: 'var(--text-muted)', 'stroke-width': 1 }));
    runde.forEach((val, i) => {
      const x = left + i * (barW + gap);
      const h = (val / maxRunda) * (chartH - 20);
      svg.appendChild(elNS('rect', { x: x, y: baseY - h, width: barW, height: h, fill: 'var(--accent)', rx: 2 }));
      const labelV = elNS('text', { x: x + barW / 2, y: baseY - h - 6, 'text-anchor': 'middle', 'font-family': 'var(--font-mono)', 'font-size': 9.5, fill: 'var(--text)' });
      labelV.textContent = Math.round(val);
      svg.appendChild(labelV);
      const labelR = elNS('text', { x: x + barW / 2, y: baseY + 14, 'text-anchor': 'middle', 'font-size': 9, fill: 'var(--text-muted)' });
      labelR.textContent = 'R' + (i + 1);
      svg.appendChild(labelR);
    });

    sK.textContent = K.toFixed(2);
    sTotalTeoretic.textContent = Math.round(K * dI) + ' u.m.';
    sTotalRunde.textContent = Math.round(totalRunde) + ' u.m.';
  }
  slider.addEventListener('input', recalc);
  recalc();
  return wrap;
}

  const eyebrowExp = el('div', 'exercitiu-eyebrow', 'V. Explorator: multiplicatorul investițiilor');

  root.appendChild(eyebrowExp);
