<!doctype html>
<html lang="ro">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Capitolul 4 · Factorii de producție</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,500;8..60,600&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet" />
<style>
:root {
  --bg: #f5f6f4;
  --surface: #ffffff;
  --surface-2: #eef1ed;
  --border: #d8dcd6;
  --text: #1b2420;
  --text-muted: #5c6660;
  --accent: #1e3a5f;
  --accent-soft: #e7edf3;
  --good: #1f7a4d;
  --good-bg: #e8f5ee;
  --bad: #b23a2e;
  --bad-bg: #fbeae8;
  --mark: #a8790f;
  --font-display: "Source Serif 4", Georgia, serif;
  --font-body: "Inter", system-ui, sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, monospace;
}
* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; background: var(--bg); color: var(--text); font-family: var(--font-body); }
#app { max-width: 800px; margin: 0 auto; padding: 0 20px 90px; }
h1, h2, h3 { font-weight: 600; color: var(--text); margin: 0; }
p { line-height: 1.7; color: var(--text); margin: 0 0 12px; }
p:last-child { margin-bottom: 0; }

.toc { border: 1px solid var(--border); border-radius: 10px; padding: 16px 20px; margin-top: 20px; background: var(--surface); }
.toc__titlu { font-family: var(--font-mono); font-size: 11.5px; text-transform: uppercase; letter-spacing: 0.06em; color: var(--text-muted); margin-bottom: 8px; }
.toc ol { margin: 0; padding-left: 18px; columns: 2; column-gap: 24px; }
.toc li { font-size: 13.5px; margin-bottom: 5px; break-inside: avoid; }
.toc a { color: var(--accent); text-decoration: none; }
.toc a:hover { text-decoration: underline; }
@media (max-width: 560px) { .toc ol { columns: 1; } }

.scor-bar { position: sticky; top: 0; z-index: 10; padding: 10px 16px 12px; margin: 0 -20px; background: rgba(245, 246, 244, 0.95); backdrop-filter: blur(4px); border-bottom: 1px solid var(--border); }
.scor-bar__row { display: flex; align-items: center; justify-content: space-between; gap: 16px; margin-bottom: 6px; }
.scor-bar__label { font-family: var(--font-mono); font-size: 12.5px; color: var(--text-muted); white-space: nowrap; }
.scor-bar__track { height: 5px; border-radius: 3px; background: var(--surface-2); overflow: hidden; display: flex; }
.scor-bar__fill-good { background: var(--good); height: 100%; }
.scor-bar__fill-bad { background: var(--bad); height: 100%; }

.header { padding: 30px 0 6px; }
.header__eyebrow { font-family: var(--font-mono); font-size: 12.5px; color: var(--accent); letter-spacing: 0.06em; text-transform: uppercase; }
.header__titlu { font-family: var(--font-display); font-weight: 600; font-size: 30px; line-height: 1.3; margin-top: 6px; }

.obiective { border: 1px solid var(--border); border-radius: 10px; padding: 18px 22px; margin-top: 20px; background: var(--surface); }
.obiective__titlu { font-family: var(--font-display); font-weight: 600; font-size: 15px; color: var(--accent); margin-bottom: 10px; }
.obiective ul { margin: 0; padding-left: 18px; }
.obiective li { color: var(--text-muted); margin-bottom: 6px; font-size: 14.5px; }

.sectiune-titlu { font-family: var(--font-display); font-weight: 600; font-size: 22px; color: var(--text); margin: 44px 0 4px; padding-bottom: 8px; border-bottom: 2px solid var(--accent); }

.teorie-box { border: 1px solid var(--border); border-radius: 10px; padding: 20px 24px; margin-top: 16px; background: var(--surface); scroll-margin-top: 76px; }
.teorie-box__titlu { font-family: var(--font-display); font-weight: 600; font-size: 17px; color: var(--text); cursor: pointer; display: flex; align-items: baseline; gap: 10px; justify-content: space-between; }
.teorie-box__nr { font-family: var(--font-mono); font-size: 13px; color: var(--accent); font-weight: 500; }
.teorie-box__chevron { font-family: var(--font-mono); color: var(--text-muted); font-size: 14px; }
.teorie-box__body { margin-top: 12px; }
.teorie-box ul { margin: 8px 0 12px; padding-left: 18px; }
.teorie-box li { margin-bottom: 6px; font-size: 14.5px; color: var(--text); }

.exemplu { font-family: var(--font-body); font-style: italic; background: var(--accent-soft); border-left: 3px solid var(--accent); border-radius: 0 8px 8px 0; padding: 10px 16px; margin-top: 10px; font-size: 14px; color: var(--text); }
.exemplu__eticheta { display: block; font-style: normal; font-family: var(--font-mono); font-size: 11.5px; text-transform: uppercase; letter-spacing: 0.04em; color: var(--accent); margin-bottom: 3px; }

.formula { font-family: var(--font-mono); background: var(--surface-2); border-radius: 8px; padding: 9px 14px; margin-top: 10px; font-size: 13.5px; }
.formula__nume { display: block; font-family: var(--font-body); font-size: 12px; color: var(--text-muted); margin-bottom: 2px; }

.clasificare { margin-top: 16px; }
.clasificare__criteriu { font-family: var(--font-mono); font-size: 12px; color: var(--text-muted); margin-bottom: 4px; }
.clasificare__definitii { margin-top: 10px; }
.clasificare__definitii p { font-size: 13.5px; margin: 0 0 6px; color: var(--text); }
.clasificare__definitii p:last-child { margin-bottom: 0; }
.clasificare__definitii strong { color: var(--accent); }

.mini-calc { margin-top: 14px; padding: 14px 16px; border: 1px dashed var(--accent); border-radius: 8px; background: var(--accent-soft); }
.mini-calc__titlu { font-family: var(--font-mono); font-size: 11.5px; text-transform: uppercase; letter-spacing: 0.04em; color: var(--accent); margin-bottom: 10px; }
.mini-calc__randuri { display: flex; gap: 18px; flex-wrap: wrap; margin-bottom: 10px; }
.mini-calc__randuri label { display: flex; flex-direction: column; gap: 4px; font-size: 12.5px; color: var(--text-muted); font-family: var(--font-mono); }
.mini-calc__randuri input { font-family: var(--font-mono); font-size: 14px; padding: 6px 10px; border: 1px solid var(--border); border-radius: 6px; width: 100px; background: var(--surface); color: var(--text); }
.mini-calc__rezultat { font-family: var(--font-mono); font-size: 13.5px; color: var(--text); }
.mini-calc__rezultat strong { color: var(--accent); }

.diagrama { margin-top: 12px; }

.nota-legatura { font-size: 13.5px; color: var(--text-muted); margin-top: 10px; padding-top: 10px; border-top: 1px dashed var(--border); }
.nota-legatura a { color: var(--accent); }

.exercitiu-eyebrow { font-family: var(--font-display); font-weight: 600; font-size: 20px; color: var(--accent); margin-top: 44px; margin-bottom: 4px; scroll-margin-top: 76px; }
.exercitiu-sub { color: var(--text-muted); font-size: 13.5px; margin-bottom: 6px; }

.card { border: 1px solid var(--border); border-radius: 10px; padding: 18px 22px; margin-top: 14px; background: var(--surface); }
.card__intrebare { font-size: 15px; margin-bottom: 14px; margin-top: 0; font-weight: 500; }

.optiuni { display: flex; flex-direction: column; gap: 8px; }
.optiune { display: flex; align-items: center; gap: 10px; padding: 9px 12px; border: 1px solid var(--border); border-radius: 8px; cursor: pointer; font-size: 14.5px; background: transparent; color: var(--text); text-align: left; font-family: var(--font-body); }
.optiune:hover:not(:disabled) { border-color: var(--accent); }
.optiune.selectata { border-color: var(--accent); background: var(--accent-soft); }
.optiune.corecta { border-color: var(--good); background: var(--good-bg); color: var(--good); }
.optiune.gresita { border-color: var(--bad); background: var(--bad-bg); color: var(--bad); }

.buton { font-family: var(--font-body); font-weight: 600; font-size: 14px; padding: 9px 18px; border-radius: 8px; border: 1.5px solid var(--accent); background: transparent; color: var(--accent); cursor: pointer; margin-top: 14px; }
.buton:hover:not(:disabled) { background: var(--accent-soft); }
.buton:disabled { opacity: 0.4; cursor: not-allowed; }

.af-butoane { display: flex; gap: 10px; }
.af-buton { flex: 1; padding: 10px; border-radius: 8px; border: 1px solid var(--border); background: transparent; color: var(--text); font-family: var(--font-body); font-size: 14px; cursor: pointer; }
.af-buton.corecta { border-color: var(--good); background: var(--good-bg); color: var(--good); }
.af-buton.gresita { border-color: var(--bad); background: var(--bad-bg); color: var(--bad); }

.problema-input { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.problema-input input { font-family: var(--font-mono); font-size: 15px; padding: 8px 12px; border-radius: 8px; border: 1px solid var(--border); background: var(--surface-2); color: var(--text); width: 120px; }
.problema-input input:focus { outline: 2px solid var(--accent); border-color: var(--accent); }
.unitate { color: var(--text-muted); font-family: var(--font-mono); font-size: 13px; }

.feedback { margin-top: 12px; padding: 10px 14px; border-radius: 8px; font-size: 14px; line-height: 1.55; }
.feedback.corect { background: var(--good-bg); color: var(--good); }
.feedback.gresit { background: var(--bad-bg); color: var(--bad); }

.asociere-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px 20px; }
.asociere-coloana { display: flex; flex-direction: column; gap: 8px; }
@media (max-width: 480px) { .asociere-grid { grid-template-columns: 1fr; } }

.simulator { border: 1px solid var(--border); border-radius: 10px; padding: 20px 24px; margin-top: 14px; background: var(--surface); }
.simulator__nota { margin-top: 0; color: var(--text-muted); font-size: 14px; }
.simulator__sliders { display: flex; flex-direction: column; gap: 16px; margin-top: 16px; }
.slider-row label { display: flex; justify-content: space-between; font-size: 13.5px; color: var(--text-muted); margin-bottom: 6px; font-family: var(--font-mono); }
.slider-row input[type="range"] { width: 100%; accent-color: var(--accent); }
.simulator__citire { display: flex; gap: 20px; margin-top: 16px; font-family: var(--font-mono); flex-wrap: wrap; }
.simulator__citire strong { color: var(--accent); font-size: 18px; display: block; }
.simulator__citire span { color: var(--text-muted); font-size: 11.5px; }
.legenda { display: flex; gap: 18px; margin-top: 10px; font-size: 12.5px; color: var(--text-muted); flex-wrap: wrap; }
.legenda span.item { display: inline-flex; align-items: center; gap: 6px; }
.punct-legenda { width: 10px; height: 10px; border-radius: 50%; display: inline-block; }

@media (max-width: 480px) {
  .header__titlu { font-size: 24px; }
}
</style>
</head>
<body>
<div id="app"></div>

<script>
// ---------------------------------------------------------------------
// Continutul capitolului - teoria completa, structurata dupa manual:
// I. Caracterizarea generala a F.P (traditionali + neofactori)
// II. Munca  III. Natura  IV. Capitalul (uzura, amortizare)
// V. Combinarea F.P (proprietati, substituire, productivitate marginala)
// ---------------------------------------------------------------------
const DATA = {
  capitol: {
    numar: 4,
    titlu: 'Factorii de producție',
    obiective: [
      'Să identifici factorii de producție și să-i clasifici',

    ]
  },

    {
      id: 'fp-general', nr: '1', titlu: 'Factorii de producție: caracterizare generală',
      text: [

        'Factorii de producție reprezintă resursele atrase și utilizate în activitatea economică, din care rezultă bunuri economice utile, destinate pieței. Ei sunt "intrări" (input-uri) ale producției, la fel cum bunurile obținute sunt "ieșiri" (output-uri) - de exemplu, tu consumi un covrig (ieșire), nu făina din care e făcut (intrare).'
      ],
      puncteCheie: [
        { termen: 'Sunt input-uri', descriere: 'ale activității economice, la fel ca resursele din care provin' },
        { termen: 'Sunt partea activă a resurselor', descriere: 'atrasă și folosită efectiv în producție' },
        { termen: 'Sunt limitați', descriere: 'la fel ca resursele din care provin' },
        { termen: 'Contribuția la sporirea producției poate fi', descriere: 'preponderent cantitativă (dezvoltare extensivă) sau preponderent calitativă (dezvoltare intensivă)' }
      ],
      clasificari: [
        { criteriu: 'Factorii de producție tradiționali (clasici)', categorii: [
          { nume: 'Munca', definitie: 'factor primar/originar' },
          { nume: 'Natura', definitie: 'factor primar/originar' },
          { nume: 'Capitalul', definitie: 'factor derivat, din combinarea muncii și naturii' }
        ] },
        { criteriu: 'Neofactorii de producție (sporesc eficiența celor tradiționali)', categorii: [
          { nume: 'Informația', definitie: 'cunoștințe și date folosite pentru decizii economice mai bune' },
          { nume: 'Tehnologia', definitie: 'metode și echipamente care sporesc eficiența folosirii factorilor clasici' },
          { nume: 'Abilitatea întreprinzătorului', definitie: 'capacitatea de a organiza, decide și de a-și asuma riscuri pentru profit' },
          { nume: 'Managementul și marketingul', definitie: 'activitățile de conducere a firmei și de studiere/satisfacere a pieței' }
        ] }
      ],
      exemple: [], formule: []
    },
    {
      id: 'munca', nr: '2', titlu: 'Munca - factor activ și determinant',
      text: [
        'Munca, ca factor de producție, este o activitate conștientă, specific umană, care se finalizează în obținerea de bunuri economice utile. Atenție: nu orice activitate conștientă și utilă e "muncă" din punct de vedere economic - de exemplu, temele unei eleve sau activitățile gospodărești din familie sunt muncă în sens larg, dar nu sunt remunerate sau destinate pieței, deci nu sunt muncă în sensul factorului de producție.',
        'Munca poate fi analizată cantitativ (resursele disponibile de muncă și durata muncii), calitativ (nivelul de pregătire și calificare) și structural (categoriile socio-profesionale).'
      ],
      puncteCheie: [
        { termen: 'Activitate conștientă și rațională', descriere: 'presupune stabilirea unui scop și a mijloacelor necesare atingerii lui' },
        { termen: 'Implică efort fizic și intelectual, plus experiență', descriere: 'capacitate/forță de muncă' },
        { termen: 'Factor activ și determinant', descriere: 'față de ceilalți factori - condiționează existența, folosirea, combinarea și perfecționarea lor' },
        { termen: 'Sporirea eficienței muncii', descriere: 'a dus la denumirea de "capital uman"' }
      ],
      exemple: [], formule: []
    },
    {
      id: 'natura', nr: '3', titlu: 'Natura - factor primar de producție',
      text: [
        'Natura, ca factor de producție, reprezintă ansamblul resurselor naturale brute utilizate, adaptate și transformate de oameni prin muncă, potrivit nevoilor și intereselor lor. Generic, natura e denumită pământ - cel mai important factor natural de producție - dar include și resursele de apă, minerale și cosmice (căldură, lumină).'
      ],
      puncteCheie: [
        'Este limitat ca suprafață, în raport cu nevoile',
        'Este locul desfășurării oricărei activități umane și principalul mijloc de producție în agricultură',
        'Nu este produs de om, dar acesta îi poate spori valoarea și randamentul prin acțiuni agricole - de unde și denumirea de "pământ-capital"',
        'Este, până acum, un element de neînlocuit, cu mare capacitate de regenerare dacă e utilizat rațional'
      ],
      exemple: [], formule: []
    },
    {
      id: 'capital', nr: '4', titlu: 'Capitalul - factor de producție derivat',
      text: [
        'Capitalul, ca factor de producție, reflectă ansamblul bunurilor materiale produse prin muncă și utilizate pentru realizarea de noi bunuri economice destinate pieței (mașini, utilaje, materii prime). Atenție: nu trebuie confundat cu formele de capital în sens larg (capital bănesc, acțiuni, obligațiuni), care nu produc direct bunuri economice.',
        'Capitalul tehnic (KT) e format din capitalul fix (KF - mașini, utilaje, clădiri) și capitalul circulant (KC - materii prime, materiale, combustibil). Capitalul fix participă la mai multe cicluri economice și se consumă treptat; capitalul circulant participă la un singur ciclu și se consumă integral, dintr-o dată.',
        'Pe durata folosirii, capitalul fix se uzează - fie din cauza folosirii/factorilor naturali (uzură fizică), fie din cauza progresului tehnic sau a condițiilor pieței (uzură morală). Amortizarea este expresia valorică a acestei uzuri: recuperarea treptată a valorii capitalului fix, prin includerea ei în costul bunurilor produse cu ajutorul lui.'
      ],
      puncteCheie: [],
      exemple: [
        'Dacă KT = 500 mil. u.m., din care 80% e capital fix (KF), cu o rată anuală de amortizare de 20%: KF = 80% x 500 = 400 mil.; KC = 500 - 400 = 100 mil.; A = 20% x 400 = 80 mil.; Kcons = A + KC = 80 + 100 = 180 mil. u.m.'
      ],
      formule: [
        { nume: 'Capitalul tehnic', formula: 'KT = KF + KC' },
        { nume: 'Amortizarea anuală (mărime absolută)', formula: 'A = KF / T' },
        { nume: 'Rata anuală a amortizării', formula: 'RA = (A/KF) x 100 = (1/T) x 100' },
        { nume: 'Capitalul consumat (costuri materiale)', formula: 'Kcons = A + KC = Cmat' }
      ],
      calculator: 'amortizare',
      notaLegatura: { href: '#sect-explorator-capital', text: 'Explorează interactiv structura capitalului tehnic în secțiunea VI, mai jos.' }
    },
    {
      id: 'combinare', nr: '5', titlu: 'Combinarea factorilor de producție',
      text: [
        'Combinarea factorilor de producție este operațiunea tehnico-economică de unire, sub aspect cantitativ, calitativ și structural, a factorilor de producție - o latură tehnică (unirea unor factori specifici) și una economică (sporirea eficienței). Ea se bazează pe substituirea factorilor: înlocuirea totală sau parțială a unui factor cu altul, astfel încât producția să rămână aceeași sau să crească.'
      ],
      puncteCheie: [
        'Natura activității economice',
        'Cererea (nevoile solvabile) de bunuri și servicii',
        'Condițiile financiare și tehnice de producție',
        'Abilitatea întreprinzătorului, activitatea de management și de marketing'
      ],
      clasificari: [
        { criteriu: 'Proprietăți ale factorilor de producție, care permit combinarea lor', categorii: [
          { nume: 'Adaptabilitate', definitie: 'un muncitor poate deservi una sau mai multe mașini' },
          { nume: 'Divizibilitate', definitie: 'o suprafață de pământ poate fi împărțită în mai multe hectare, fără să-și piardă calitatea' },
          { nume: 'Complementaritate', definitie: 'un costum cere o cantitate anume de stofă, mașini de cusut, muncitori' },
          { nume: 'Substituire', definitie: '5 lucrători agricoli pot fi înlocuiți cu un tractor' }
        ] }
      ],
      exemple: [],
      formule: []
    },
    {
      id: 'productivitate-substitutie', nr: '6', titlu: 'Productivitatea marginală și rata de substituție',
      text: [
        'Productivitatea marginală a unui factor de producție (x) reflectă sporul producției (ΔQ) determinat de creșterea cu o unitate a acelui factor (Δx), ceilalți factori rămânând constanți.',
        'Rata marginală de substituție reflectă cantitatea suplimentară dintr-un factor de producție (ΔX) necesară pentru a compensa reducerea cu o unitate a altui factor (-ΔY), astfel încât producția să rămână cel puțin aceeași.'
      ],
      formule: [
        { nume: 'Productivitatea marginală', formula: 'Wmg(x) = ΔQ/Δx' },
        { nume: 'Rata marginală de substituție', formula: 'Rms = Wmg(y)/Wmg(x) = Δx/-Δy' }
      ],
      exemple: [
        'O firmă disponibilizează un muncitor, iar producția scade de la 900 la 720 buc. (cu 20%). Productivitatea marginală a muncii (a muncitorului disponibilizat) este Wmg(L) = ΔQ/ΔL = -180/-1 = 180 buc. Dacă firma vrea să recupereze producția pierdută folosind capital suplimentar (mașini), a cărui productivitate marginală este Wmg(K) = 90 buc., rata marginală de substituție este Rms = Wmg(L)/Wmg(K) = 180/90 = 2 - sunt necesare 2 unități de capital pentru a înlocui munca unui singur lucrător, ca producția să rămână aceeași.'

// ---------------------------------------------------------------------
// Functii economice specifice acestui capitol.
// ---------------------------------------------------------------------
function calculeazaCapital(KT, procentKF, RA) {
  const KF = (procentKF / 100) * KT;
  const KC = KT - KF;
  const A = (RA / 100) * KF;
  const Kcons = A + KC;
  const T = RA ? 100 / RA : null;
  return { KF, KC, A, Kcons, T };
}
function calculeazaRms(wmgSubstituit, wmgSubstituent) {
  return wmgSubstituit / wmgSubstituent;
}

function buildWaterfallChart(componente) {
  const width = 260, height = 150, left = 14, right = 14, top = 14, bottom = 30;
  const chartH = height - top - bottom, chartW = width - left - right;
  const total = componente.reduce((a, c) => a + c.val, 0);

  const scale = chartH / (total * 1.1);
  const baseY = top + chartH;
  const svg = elNS('svg', { width: '100%', viewBox: '0 0 ' + width + ' ' + height, role: 'img', 'aria-label': 'Cascada: ' + componente.map(c => c.label + '=' + c.val).join(', ') + ', total=' + total });
  svg.appendChild(elNS('line', { x1: left, y1: baseY, x2: width - right, y2: baseY, stroke: 'var(--text-muted)', 'stroke-width': 1 }));
  let yCursor = baseY, x = left;
  componente.forEach(c => {

    const lv = elNS('text', { x: x + barW / 2, y: yCursor - h - 6, 'text-anchor': 'middle', 'font-family': 'var(--font-mono)', 'font-size': 10.5, fill: 'var(--text)', 'font-weight': 600 });

    ll.textContent = c.label;
    svg.appendChild(ll);
    if (yCursor < baseY) svg.appendChild(elNS('line', { x1: x - gap * 0.4, y1: yCursor, x2: x, y2: yCursor, stroke: 'var(--border)', 'stroke-width': 1, 'stroke-dasharray': '2 2' }));
    yCursor -= h;
    x += barW + gap;
  });
  const hTotal = Math.max(2, total * scale);
  svg.appendChild(elNS('rect', { x, y: baseY - hTotal, width: barW, height: hTotal, fill: 'var(--accent)', rx: 2 }));
  const lvT = elNS('text', { x: x + barW / 2, y: baseY - hTotal - 6, 'text-anchor': 'middle', 'font-family': 'var(--font-mono)', 'font-size': 10.5, fill: 'var(--accent)', 'font-weight': 700 });

  llT.textContent = 'Total';
  svg.appendChild(llT);
  return svg;
}
function buildDonutChart(componente) {
  const size = 200, cx = size / 2, cy = size / 2 - 6, rOut = 70, rIn = 42;
  const total = componente.reduce((a, c) => a + Math.max(0, c.val), 0) || 1;
  const svg = elNS('svg', { width: '100%', viewBox: '0 0 ' + size + ' ' + (size + 34), role: 'img', 'aria-label': 'Compozitie: ' + componente.map(c => c.label + '=' + c.val).join(', ') });
  let unghiStart = -Math.PI / 2;
  componente.forEach(c => {
    const frac = Math.max(0, c.val) / total;
    const unghiEnd = unghiStart + frac * 2 * Math.PI;
    const x0o = cx + rOut * Math.cos(unghiStart), y0o = cy + rOut * Math.sin(unghiStart);
    const x1o = cx + rOut * Math.cos(unghiEnd), y1o = cy + rOut * Math.sin(unghiEnd);
    const x0i = cx + rIn * Math.cos(unghiEnd), y0i = cy + rIn * Math.sin(unghiEnd);
    const x1i = cx + rIn * Math.cos(unghiStart), y1i = cy + rIn * Math.sin(unghiStart);
    const mare = frac > 0.5 ? 1 : 0;
    const d = 'M ' + x0o + ' ' + y0o + ' A ' + rOut + ' ' + rOut + ' 0 ' + mare + ' 1 ' + x1o + ' ' + y1o + ' L ' + x0i + ' ' + y0i + ' A ' + rIn + ' ' + rIn + ' 0 ' + mare + ' 0 ' + x1i + ' ' + y1i + ' Z';
    if (frac > 0.001) svg.appendChild(elNS('path', { d, fill: c.culoare }));
    unghiStart = unghiEnd;
  });
  const legenda = elNS('g', {});
  componente.forEach((c, i) => {
    const ly = size + 12 + Math.floor(i / 2) * 16;
    const lx = 10 + (i % 2) * (size / 2);
    legenda.appendChild(elNS('rect', { x: lx, y: ly - 8, width: 9, height: 9, fill: c.culoare, rx: 2 }));
    const t = elNS('text', { x: lx + 13, y: ly, 'font-size': 9.5, fill: 'var(--text-muted)' });
    t.textContent = c.label + ' (' + Math.round(c.val / total * 1000) / 10 + '%)';
    legenda.appendChild(t);
  });
  svg.appendChild(legenda);
  return svg;
}

function buildClasificareTree(criteriu, categorii, optiuni) {

  const wrap = el('div', 'clasificare');

    wrap.appendChild(listaDef);
  }
  return wrap;

  function recalc() {
    const KT = Number(inputKT.value), proc = Number(inputProc.value), RA = Number(inputRA.value);
    if (inputKT.value === '' || inputProc.value === '' || inputRA.value === '' || isNaN(KT) || isNaN(proc) || isNaN(RA)) {
      rezultat.textContent = 'Completează toate cele 3 valori.';
      chartWrap.innerHTML = '';
      return;
    }
    const r = calculeazaCapital(KT, proc, RA);
    rezultat.innerHTML = '';
    const linii = [
      ['KF', r.KF], ['KC', r.KC], ['A (anual)', r.A], ['Kcons', r.Kcons], ['T (ani)', r.T]
    ];
    linii.forEach((pair, i) => {
      if (i > 0) rezultat.appendChild(document.createTextNode('   '));
      rezultat.appendChild(document.createTextNode(pair[0] + ' = '));
      const strong = document.createElement('strong');
      strong.textContent = Math.round(pair[1] * 100) / 100;
      rezultat.appendChild(strong);
    });
    chartWrap.innerHTML = '';
    chartWrap.appendChild(buildDonutChart([
      { label: 'Capital fix (KF)', val: r.KF, culoare: coloriSegmente[0] },
      { label: 'Capital circulant (KC)', val: r.KC, culoare: coloriSegmente[1] }
    ]));
  }
  inputKT.addEventListener('input', recalc);
  inputProc.addEventListener('input', recalc);
  inputRA.addEventListener('input', recalc);
  recalc();
  return box;
}

function buildRmsCalc() {

    const y = Number(inputSubstituit.value), x = Number(inputSubstituent.value);
    if (inputSubstituit.value === '' || inputSubstituent.value === '' || isNaN(y) || isNaN(x) || x === 0) {
      rezultat.textContent = 'Completează ambele valori (x diferit de 0).';

      return;
    }
    const rms = calculeazaRms(y, x);
    rezultat.innerHTML = '';
    rezultat.appendChild(document.createTextNode('Rms = '));
    const strong = document.createElement('strong');
    strong.textContent = Math.round(rms * 100) / 100;
    rezultat.appendChild(strong);
    rezultat.appendChild(document.createTextNode(' unități din (x) pentru fiecare unitate sacrificată din (y).'));
    chartWrap.innerHTML = '';
    const maxV = Math.max(Math.abs(y), Math.abs(x), 1) * 1.15;
    chartWrap.appendChild(buildDumbbellChart('Wmg(y) substituit', Math.abs(y), 'Wmg(x) substituent', Math.abs(x), maxV, 'var(--bad)', 'var(--accent)'));
  }
  inputSubstituit.addEventListener('input', recalc);
  inputSubstituent.addEventListener('input', recalc);
  recalc();
  return box;
}

  const wrap = el('div', 'simulator');
  wrap.appendChild(el('p', 'simulator__nota', 'Câți muncitori disponibilizezi? Vezi câte unități de capital sunt necesare ca să compensezi, păstrând producția constantă (Rms = 2, ca în exemplul de mai sus).'));

  const svg = elNS('svg', { width: '100%', viewBox: '0 0 ' + width + ' ' + height, role: 'img', 'aria-label': 'Substituirea muncii cu capital, cu productia constanta' });

  const labelX = elNS('text', { x: left + chartW, y: height - 8, 'font-size': 10.5, fill: 'var(--text-muted)', 'text-anchor': 'end' }); labelX.textContent = 'Muncă (L)';
  svg.appendChild(labelY); svg.appendChild(labelX);

  const linie = elNS('line', { stroke: 'var(--accent)', 'stroke-width': 2, 'stroke-dasharray': '4 3' });
  svg.appendChild(linie);
  const punctA = elNS('circle', { cx: sx(L0), cy: sy(K0), r: 5, fill: 'var(--text-muted)' });
  const labelA = elNS('text', { x: sx(L0) + 8, y: sy(K0) + 4, 'font-family': 'var(--font-mono)', 'font-size': 11, fill: 'var(--text-muted)' }); labelA.textContent = 'A';
  svg.appendChild(punctA); svg.appendChild(labelA);
  const punctB = elNS('circle', { r: 6, fill: 'var(--mark)' });
  const labelB = elNS('text', { 'font-family': 'var(--font-display)', 'font-weight': 600, 'font-size': 14, fill: 'var(--mark)' }); labelB.textContent = 'B';
  svg.appendChild(punctB); svg.appendChild(labelB);
  wrap.appendChild(svg);

  const legenda = el('div', 'legenda');
  legenda.appendChild(legendItem('var(--text-muted)', 'A: combinația inițială'));
  legenda.appendChild(legendItem('var(--mark)', 'B: după substituire (producție egală)'));
  wrap.appendChild(legenda);

  const citire = el('div', 'simulator__citire');
  const boxL = document.createElement('div'); const sL = document.createElement('strong'); boxL.appendChild(sL); boxL.appendChild(el('span', '', 'Muncitori disponibilizați (ΔL)'));
  const boxK = document.createElement('div'); const sK = document.createElement('strong'); boxK.appendChild(sK); boxK.appendChild(el('span', '', 'Capital suplimentar necesar (ΔK)'));
  citire.appendChild(boxL); citire.appendChild(boxK);
  wrap.appendChild(citire);

  const sliders = el('div', 'simulator__sliders');
  const row = el('div', 'slider-row');
  const label = document.createElement('label');
  label.appendChild(el('span', '', 'Muncitori disponibilizați (ΔL)'));
  const labelVal = el('span', '', '0');
  label.appendChild(labelVal);
  row.appendChild(label);
  const slider = document.createElement('input');
  slider.type = 'range'; slider.min = '0'; slider.max = '5'; slider.step = '1'; slider.value = '0';
  row.appendChild(slider);
  sliders.appendChild(row);
  wrap.appendChild(sliders);

  function recalc(dL) {
    labelVal.textContent = dL;
    const dK = RMS_FIX * dL;
    const L1 = L0 - dL, K1 = K0 + dK;
    linie.setAttribute('x1', sx(L0)); linie.setAttribute('y1', sy(K0));
    linie.setAttribute('x2', sx(L1)); linie.setAttribute('y2', sy(K1));
    punctB.setAttribute('cx', sx(L1)); punctB.setAttribute('cy', sy(K1));
    labelB.setAttribute('x', sx(L1) + 8); labelB.setAttribute('y', sy(K1) - 8);
    sL.textContent = dL;
    sK.textContent = dK;
  }
  slider.addEventListener('input', () => recalc(Number(slider.value)));
  recalc(0);
  return wrap;
}

function buildQuizGrila(item, idx) {
  const card = el('div', 'card');
  card.appendChild(el('p', 'card__intrebare', (idx + 1) + '. ' + item.intrebare));
  const optWrap = el('div', 'optiuni');
  const verifBtn = el('button', 'buton', 'Verifică');
  verifBtn.disabled = true;
  const feedback = document.createElement('div');
  let selectat = null, rezolvat = false;
  const butoane = [];
  item.optiuni.forEach((text, i) => {
    const btn = el('button', 'optiune', String.fromCharCode(97 + i) + ') ' + text);
    btn.addEventListener('click', () => {
      if (rezolvat) return;
      selectat = i;
      butoane.forEach((b, j) => b.classList.toggle('selectata', j === i));
      verifBtn.disabled = false;
    });
    butoane.push(btn);
    optWrap.appendChild(btn);
  });
  verifBtn.addEventListener('click', () => {
    if (selectat === null || rezolvat) return;
    rezolvat = true;
    const corect = selectat === item.corect;
    butoane.forEach((b, i) => {
      b.disabled = true;
      if (i === item.corect) b.classList.add('corecta');
      else if (i === selectat) b.classList.add('gresita');
    });
    verifBtn.disabled = true;
    feedback.className = 'feedback ' + (corect ? 'corect' : 'gresit');
    feedback.textContent = (corect ? 'Corect. ' : 'Nu e chiar așa. ') + item.explicatie;
    inregistreazaScor(corect);
  });
  card.appendChild(optWrap); card.appendChild(verifBtn); card.appendChild(feedback);
  return card;
}

function buildQuizAF(item, idx) {
  const card = el('div', 'card');
  card.appendChild(el('p', 'card__intrebare', (idx + 1) + '. ' + item.enunt));
  const wrap = el('div', 'af-butoane');
  const btnA = el('button', 'af-buton', 'Adevărat');
  const btnF = el('button', 'af-buton', 'Fals');
  wrap.appendChild(btnA); wrap.appendChild(btnF);
  const feedback = document.createElement('div');
  let rezolvat = false;
  function raspunde(valoare, btnAles) {
    if (rezolvat) return;
    rezolvat = true;
    const corect = valoare === item.corect;
    btnA.disabled = true; btnF.disabled = true;
    (item.corect ? btnA : btnF).classList.add('corecta');
    if (!corect) btnAles.classList.add('gresita');
    feedback.className = 'feedback ' + (corect ? 'corect' : 'gresit');
    feedback.textContent = (corect ? 'Corect. ' : 'Nu e chiar așa. ') + item.explicatie;
    inregistreazaScor(corect);
  }
  btnA.addEventListener('click', () => raspunde(true, btnA));
  btnF.addEventListener('click', () => raspunde(false, btnF));
  card.appendChild(wrap); card.appendChild(feedback);
  return card;
}

function buildQuizProblema(item, idx) {
  const card = el('div', 'card');
  card.appendChild(el('p', 'card__intrebare', (idx + 1) + '. ' + item.enunt));
  const wrap = el('div', 'problema-input');
  const input = document.createElement('input');
  input.type = 'number'; input.step = 'any'; input.placeholder = 'răspuns';
  wrap.appendChild(input);
  if (item.unitate) wrap.appendChild(el('span', 'unitate', item.unitate));
  const verifBtn = el('button', 'buton', 'Verifică');
  verifBtn.style.marginTop = '0'; verifBtn.disabled = true;
  wrap.appendChild(verifBtn);
  const feedback = document.createElement('div');
  input.addEventListener('input', () => { verifBtn.disabled = input.value === ''; });
  let rezolvat = false;
  verifBtn.addEventListener('click', () => {
    if (rezolvat || input.value === '') return;
    rezolvat = true;
    const val = Number(input.value);
    const corect = Math.abs(val - item.corect) <= item.toleranta;
    input.disabled = true; verifBtn.disabled = true;
    feedback.className = 'feedback ' + (corect ? 'corect' : 'gresit');
    feedback.textContent = (corect ? 'Corect. ' : ('Răspunsul corect este ' + item.corect + ' ' + item.unitate + '. ')) + item.explicatie;
    inregistreazaScor(corect);
  });
  card.appendChild(wrap); card.appendChild(feedback);
  return card;
}

// IV. Asociere
// ---------------------------------------------------------------------
function buildQuizAsociere(item, idx) {
  const card = el('div', 'card');
  if (item.instructiune) card.appendChild(el('p', 'card__intrebare', (idx + 1) + '. ' + item.instructiune));
  const grid = el('div', 'asociere-grid');
  const colA = el('div', 'asociere-coloana');
  const colB = el('div', 'asociere-coloana');
  grid.appendChild(colA); grid.appendChild(colB);
  card.appendChild(grid);
  const stare = document.createElement('div');
  card.appendChild(stare);
  let selectatId = null, rezolvate = 0;
  const total = item.perechi.length;
  const butoaneA = {};
  function verificaFinal() {
    if (rezolvate === total) {
      stare.className = 'feedback corect';
      stare.textContent = 'Ai asociat corect toate cele ' + total + ' perechi.' + (item.explicatie ? ' ' + item.explicatie : '');
    }
  }
  item.coloanaA.forEach(termen => {
    const btn = el('button', 'optiune', termen.text);
    btn.addEventListener('click', () => {
      if (btn.disabled) return;
      Object.values(butoaneA).forEach(b => b.classList.remove('selectata'));
      selectatId = termen.id;
      btn.classList.add('selectata');
    });
    butoaneA[termen.id] = btn;
    colA.appendChild(btn);
  });
  item.coloanaB.forEach(definitie => {
    const btn = el('button', 'optiune', definitie.text);
    btn.addEventListener('click', () => {
      if (btn.disabled || selectatId === null) return;
      const btnA = butoaneA[selectatId];
      const perecheCorecta = item.perechi.some(p => p.stanga === selectatId && p.dreapta === definitie.id);
      if (perecheCorecta) {
        btnA.classList.remove('selectata'); btnA.classList.add('corecta'); btnA.disabled = true;
        btn.classList.add('corecta'); btn.disabled = true;
        rezolvate++; selectatId = null;
        verificaFinal();
      } else {
        btnA.classList.add('gresita'); btn.classList.add('gresita');
        setTimeout(() => { btnA.classList.remove('selectata', 'gresita'); btn.classList.remove('gresita'); }, 600);
        selectatId = null;
      }
    });
    colB.appendChild(btn);
  });
  return card;
}

// VI. Explorator: structura capitalului tehnic (grafic cu bare, live)

function buildExploratorCapital() {
  const width = 320, height = 250, barW = 70, gapBar = 70, top = 16, bottom = 34;
  const chartH = height - top - bottom;
  const x1 = 60, x2 = x1 + barW + gapBar;

  const wrap = el('div', 'simulator');

  const svg = elNS('svg', { width: '100%', viewBox: '0 0 ' + width + ' ' + height, role: 'img', 'aria-label': 'Structura capitalului tehnic: KT = KF + KC, si Kcons = A + KC' });
  svg.appendChild(elNS('line', { x1: 30, y1: baseY, x2: width - 10, y2: baseY, stroke: 'var(--text-muted)', 'stroke-width': 1 }));

  const segKF = elNS('rect', { x: x1, width: barW, fill: coloriSegmente[0] });
  const segKC1 = elNS('rect', { x: x1, width: barW, fill: coloriSegmente[1] });
  const segA = elNS('rect', { x: x2, width: barW, fill: coloriSegmente[2] });
  const segKC2 = elNS('rect', { x: x2, width: barW, fill: coloriSegmente[1] });
  svg.appendChild(segKF); svg.appendChild(segKC1); svg.appendChild(segA); svg.appendChild(segKC2);

  const labelKT = elNS('text', { x: x1 + barW / 2, 'text-anchor': 'middle', 'font-family': 'var(--font-mono)', 'font-size': 12.5, fill: 'var(--text)', 'font-weight': 600 });
  const labelKcons = elNS('text', { x: x2 + barW / 2, 'text-anchor': 'middle', 'font-family': 'var(--font-mono)', 'font-size': 12.5, fill: 'var(--text)', 'font-weight': 600 });
  svg.appendChild(labelKT); svg.appendChild(labelKcons);

  const lblKT = elNS('text', { x: x1 + barW / 2, y: baseY + 16, 'text-anchor': 'middle', 'font-size': 12, fill: 'var(--text-muted)' }); lblKT.textContent = 'KT = KF + KC';
  const lblKcons = elNS('text', { x: x2 + barW / 2, y: baseY + 16, 'text-anchor': 'middle', 'font-size': 12, fill: 'var(--text-muted)' }); lblKcons.textContent = 'Kcons = A + KC';
  svg.appendChild(lblKT); svg.appendChild(lblKcons);
  wrap.appendChild(svg);

  const legenda = el('div', 'legenda');
  legenda.appendChild(legendItem(coloriSegmente[0], 'Capital fix (KF)'));
  legenda.appendChild(legendItem(coloriSegmente[1], 'Capital circulant (KC)'));
  legenda.appendChild(legendItem(coloriSegmente[2], 'Amortizare anuală (A)'));
  wrap.appendChild(legenda);

  const citire = el('div', 'simulator__citire');
  function citireBox(eticheta) {
    const box = document.createElement('div');
    const strong = document.createElement('strong');
    box.appendChild(strong);
    box.appendChild(el('span', '', eticheta));
    citire.appendChild(box);
    return strong;
  }
  const sKF = citireBox('KF'); const sKC = citireBox('KC'); const sA = citireBox('A/an'); const sRA = citireBox('RA (%)'); const sKcons = citireBox('Kcons');
  wrap.appendChild(citire);

  const sliders = el('div', 'simulator__sliders');
  function randSlider(labelTxt, min, max, step, val, unitate, onChange) {
    const row = el('div', 'slider-row');
    const label = document.createElement('label');
    const labelSpanTxt = el('span', '', labelTxt);
    const labelSpanVal = el('span', '', val + (unitate || ''));
    label.appendChild(labelSpanTxt); label.appendChild(labelSpanVal);
    row.appendChild(label);
    const input = document.createElement('input');
    input.type = 'range'; input.min = min; input.max = max; input.step = step; input.value = val;
    input.addEventListener('input', () => { labelSpanVal.textContent = input.value + (unitate || ''); onChange(); });
    row.appendChild(input);
    sliders.appendChild(row);
    return input;
  }
  const inputKT = randSlider('Capital tehnic (KT)', 100, 1000, 50, 500, ' u.m.', () => recalc());
  const inputProc = randSlider('Procent din KT care e KF', 30, 90, 5, 80, '%', () => recalc());
  const inputT = randSlider('Durata de amortizare (T)', 2, 20, 1, 5, ' ani', () => recalc());
  wrap.appendChild(sliders);

  const maxKT = 1000;
  const scale = chartH / maxKT;

  function recalc() {
    const KT = Number(inputKT.value), proc = Number(inputProc.value), T = Number(inputT.value);
    const RA = 100 / T;
    const r = calculeazaCapital(KT, proc, RA);

    const hKF = r.KF * scale, hKC = r.KC * scale;
    segKF.setAttribute('y', baseY - hKF); segKF.setAttribute('height', hKF);
    segKC1.setAttribute('y', baseY - hKF - hKC); segKC1.setAttribute('height', hKC);
    labelKT.setAttribute('y', baseY - hKF - hKC - 8);
    labelKT.textContent = Math.round(KT) + ' u.m.';

    const hA = r.A * scale, hKC2 = r.KC * scale;
    segA.setAttribute('y', baseY - hA); segA.setAttribute('height', hA);
    segKC2.setAttribute('y', baseY - hA - hKC2); segKC2.setAttribute('height', hKC2);
    labelKcons.setAttribute('y', baseY - hA - hKC2 - 8);
    labelKcons.textContent = Math.round(r.Kcons) + ' u.m.';

    sKF.textContent = Math.round(r.KF);
    sKC.textContent = Math.round(r.KC);
    sA.textContent = Math.round(r.A * 10) / 10;
    sRA.textContent = Math.round(RA * 10) / 10;
    sKcons.textContent = Math.round(r.Kcons);
  }
  recalc();
  return wrap;
}
